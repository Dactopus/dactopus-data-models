version: 2
# Structural checks only; descriptions live in entities/commerce.yaml.
models:
  - name: orders
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: order_id, data_type: UInt64, data_tests: [unique, not_null]}
      - {name: order_number, data_type: String}
      - {name: order_date, data_type: Date, data_tests: [not_null]}
      - {name: order_time, data_type: "DateTime('UTC')"}
      - name: financial_status
        data_type: "Nullable(String)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unpaid, paid, partially_refunded, refunded, voided]
      - name: fulfillment_status
        data_type: "Nullable(String)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [unfulfilled, partially_fulfilled, fulfilled]
      - {name: is_cancelled, data_type: Bool}
      - {name: in_sales_reports, data_type: Bool}
      - {name: channel, data_type: "Nullable(String)"}
      - {name: currency, data_type: String, data_tests: [not_null]}
      - {name: platform, data_type: "LowCardinality(String)"}
      - {name: shipping_country, data_type: "Nullable(String)"}
      - {name: shipping_region, data_type: "Nullable(String)"}
      - {name: shipping_city, data_type: "Nullable(String)"}
      - {name: customer_id, data_type: "Nullable(Int64)"}
      - {name: customer_order_number, data_type: "Nullable(UInt64)"}
      - {name: new_vs_repeat, data_type: "Nullable(String)"}
      - {name: days_since_previous_order, data_type: "Nullable(Int64)"}
      - {name: months_since_first_order, data_type: "Nullable(Int64)"}
      - {name: item_quantity, data_type: Int64}
      - {name: discount_code_count, data_type: UInt64}
      - {name: total, data_type: "Decimal(38, 8)"}
      - {name: subtotal, data_type: "Decimal(38, 8)"}
      - {name: discount_total, data_type: "Decimal(38, 8)"}
      - {name: shipping_total, data_type: "Decimal(38, 8)"}
      - {name: tax_total, data_type: "Decimal(38, 8)"}
      - {name: refunded_total, data_type: "Decimal(38, 8)"}
      - {name: net_total, data_type: "Decimal(38, 8)"}
      - {name: placed_time, data_type: "DateTime64(6, 'UTC')"}
      - {name: paid_time, data_type: "Nullable(DateTime64(6, 'UTC'))"}
      - {name: completed_time, data_type: "Nullable(DateTime64(6, 'UTC'))"}
      - {name: status, data_type: String}
      - {name: customer_email, data_type: "Nullable(String)"}
      - {name: order_currency, data_type: String}
      - {name: fee_total, data_type: "Nullable(Decimal(38, 8))"}
      - {name: taxes_included, data_type: Bool}
      - {name: discount_codes, data_type: "Array(String)"}
      - {name: shipping_postcode, data_type: "Nullable(String)"}
      - {name: line_item_count, data_type: UInt64}
      - {name: synced_at, data_type: "DateTime64(9)"}
  - name: customers
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: customer_id, data_type: Int64, data_tests: [unique, not_null]}
      - {name: first_order_date, data_type: Date, data_tests: [not_null]}
      - {name: last_order_date, data_type: Date, data_tests: [not_null]}
      - {name: number_of_orders, data_type: UInt64}
      - {name: net_total, data_type: "Decimal(38, 8)"}
      - {name: second_order_within_30_days, data_type: "Nullable(Bool)"}
      - {name: second_order_within_60_days, data_type: "Nullable(Bool)"}
      - {name: second_order_within_90_days, data_type: "Nullable(Bool)"}
      - {name: second_order_within_365_days, data_type: "Nullable(Bool)"}
  - name: order_lines
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: line_id, data_type: UInt64, data_tests: [unique, not_null]}
      - name: order_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - {name: product_id, data_type: "Nullable(UInt64)"}
      - {name: variant_id, data_type: "Nullable(UInt64)"}
      - {name: sku, data_type: "Nullable(String)"}
      - {name: title, data_type: String}
      - {name: quantity, data_type: Int64}
      - {name: current_quantity, data_type: Int64}
      - {name: line_total, data_type: "Decimal(38, 8)"}
      - {name: returned_quantity, data_type: Int64}
      - {name: returned_amount, data_type: "Decimal(38, 8)"}
      - {name: line_tax, data_type: "Nullable(Decimal(38, 8))"}
      - {name: discount_total, data_type: "Nullable(Decimal(38, 8))"}
      - {name: synced_at, data_type: "DateTime64(9)"}
  - name: refunds
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: refund_id, data_type: UInt64, data_tests: [unique, not_null]}
      - name: order_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - {name: refund_date, data_type: Date, data_tests: [not_null]}
      - {name: refund_time, data_type: "DateTime('UTC')"}
      - {name: refunded_amount, data_type: "Decimal(38, 8)"}
      - {name: refunded_quantity, data_type: Int64}
      - {name: synced_at, data_type: "DateTime64(9)"}
  - name: products
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: product_id, data_type: UInt64, data_tests: [unique, not_null]}
      - {name: title, data_type: String}
      - name: status
        data_type: "Nullable(String)"
        data_tests:
          - accepted_values:
              arguments:
                values: [active, draft, archived]
      - {name: last_sold_date, data_type: "Nullable(Date)"}
  - name: product_categories_all
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: product_id, data_type: UInt64, data_tests: [not_null]}
      - {name: category, data_type: String, data_tests: [not_null]}
      - {name: category_path, data_type: String, data_tests: [not_null]}
      - {name: is_direct, data_type: Bool}
  - name: product_brands_all
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: product_id, data_type: UInt64, data_tests: [not_null]}
      - {name: brand, data_type: String, data_tests: [not_null]}
  - name: product_brands
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - name: product_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product_id
      - {name: brand, data_type: String}
  - name: line_categories
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - name: line_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('order_lines')
                field: line_id
      - {name: category, data_type: "Nullable(String)"}
      - {name: category_path, data_type: "Nullable(String)"}
      - {name: is_direct, data_type: Bool}
      - {name: quantity, data_type: Int64}
      - {name: line_total, data_type: "Decimal(38, 8)"}
      - {name: returned_quantity, data_type: Int64}
      - {name: returned_amount, data_type: "Decimal(38, 8)"}
      - {name: current_quantity, data_type: Int64}
  - name: line_brands
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - name: line_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('order_lines')
                field: line_id
      - {name: brand, data_type: "Nullable(String)"}
      - {name: quantity, data_type: Int64}
      - {name: line_total, data_type: "Decimal(38, 8)"}
      - {name: returned_quantity, data_type: Int64}
      - {name: returned_amount, data_type: "Decimal(38, 8)"}
      - {name: current_quantity, data_type: Int64}
  - name: sales_events
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: event_id, data_type: String, data_tests: [unique, not_null]}
      - name: event_type
        data_type: String
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [order, refund]
      - name: order_id
        data_type: UInt64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - {name: event_date, data_type: Date, data_tests: [not_null]}
      - {name: event_time, data_type: "DateTime('UTC')"}
      - {name: amount, data_type: "Decimal(38, 8)", data_tests: [not_null]}
  - name: product_categories
    columns:
      - {name: source_id, data_type: "LowCardinality(String)", data_tests: [woocommerce_one_source_id]}
      - {name: product_id, data_type: UInt64}
      - {name: category, data_type: String}
      - {name: category_path, data_type: String}
      - {name: is_direct, data_type: Bool}

unit_tests:
  # Refunds of 3 EUR (1 of goods, 1 of shipping, 1 of tax) in a USD store,
  # converted as each multi-currency plugin converts amounts for Analytics
  # (woocommerce_rates; orders.sql converts orders the same way). FOX
  # divides by its rate and rounds the total alone: 3 / 0.3 = 10.00, while
  # its parts round to 3.33 each. WooPayments multiplies by the payment's
  # rate and rounds the parts: 3.33 * 3 = 9.99. A refund without rates of
  # its own takes its order's. (An order whose WooPayments meta names
  # another store currency, with no other rate, has no amount and fails
  # the build in woocommerce_amount: a unit test cannot show a failure,
  # so CI builds such an order apart.) The
  # test is on refunds: dbt v2 cannot compare the rows of orders, whose
  # discount_codes is an array.
  - name: refunds_converted_by_plugin
    model: refunds
    overrides:
      macros:
        is_incremental: false
      # A store in USD with WooCommerce's defaults. dbt v2 drops the
      # project's vars that a unit test does not name, so all are named.
      vars:
        woocommerce_currency: USD
        woocommerce_price_decimals: 2
        woocommerce_timezone: UTC
        woocommerce_date_type: date_paid
        woocommerce_excluded_statuses: [pending, cancelled, failed]
        woocommerce_order_statuses: {}
        woocommerce_order_number_meta_key: ""
        woocommerce_lookback_days: 3
        woocommerce_table_prefix: wp_
        woocommerce_input_database: woocommerce_raw
        woocommerce_source_id: woocommerce
    given:
      - input: source('woocommerce_raw', 'wc_orders')
        rows:
          - {id: 1, status: wc-processing, currency: EUR, type: shop_order, tax_amount: 1, total_amount: 3, date_created_gmt: '2026-09-15 12:00:00', _peerdb_is_deleted: 0, _peerdb_version: 1}
          - {id: 2, status: wc-processing, currency: EUR, type: shop_order, tax_amount: 1, total_amount: 3, date_created_gmt: '2026-09-15 12:00:00', _peerdb_is_deleted: 0, _peerdb_version: 2}
          - {id: 11, status: wc-completed, currency: EUR, type: shop_order_refund, tax_amount: -1, total_amount: -3, date_created_gmt: '2026-09-16 12:00:00', parent_order_id: 1, _peerdb_is_deleted: 0, _peerdb_version: 4}
          - {id: 12, status: wc-completed, currency: EUR, type: shop_order_refund, tax_amount: -1, total_amount: -3, date_created_gmt: '2026-09-16 12:00:00', parent_order_id: 2, _peerdb_is_deleted: 0, _peerdb_version: 5}
          - {id: 13, status: wc-completed, currency: EUR, type: shop_order_refund, tax_amount: -1, total_amount: -3, date_created_gmt: '2026-09-16 12:00:00', parent_order_id: 2, _peerdb_is_deleted: 0, _peerdb_version: 6}
      - input: source('woocommerce_raw', 'wc_order_operational_data')
        rows:
          - {id: 11, order_id: 11, shipping_total_amount: -1, shipping_tax_amount: 0, _peerdb_is_deleted: 0, _peerdb_version: 8}
          - {id: 12, order_id: 12, shipping_total_amount: -1, shipping_tax_amount: 0, _peerdb_is_deleted: 0, _peerdb_version: 9}
          - {id: 13, order_id: 13, shipping_total_amount: -1, shipping_tax_amount: 0, _peerdb_is_deleted: 0, _peerdb_version: 10}
      - input: source('woocommerce_raw', 'wc_orders_meta')
        rows:
          - {id: 1, order_id: 1, meta_key: _woocs_order_rate, meta_value: '0.3', _peerdb_is_deleted: 0, _peerdb_version: 12}
          # Order 2 and its refund 12: WooPayments, paid at 3.3333 USD per EUR.
          - {id: 2, order_id: 2, meta_key: _wcpay_multi_currency_order_exchange_rate, meta_value: '0.3', _peerdb_is_deleted: 0, _peerdb_version: 13}
          - {id: 3, order_id: 2, meta_key: _wcpay_multi_currency_stripe_exchange_rate, meta_value: '3.3333', _peerdb_is_deleted: 0, _peerdb_version: 14}
          - {id: 4, order_id: 2, meta_key: _wcpay_multi_currency_order_default_currency, meta_value: USD, _peerdb_is_deleted: 0, _peerdb_version: 15}
          - {id: 5, order_id: 12, meta_key: _wcpay_multi_currency_order_exchange_rate, meta_value: '0.3', _peerdb_is_deleted: 0, _peerdb_version: 16}
          - {id: 6, order_id: 12, meta_key: _wcpay_multi_currency_stripe_exchange_rate, meta_value: '3.3333', _peerdb_is_deleted: 0, _peerdb_version: 17}
          - {id: 7, order_id: 12, meta_key: _wcpay_multi_currency_order_default_currency, meta_value: USD, _peerdb_is_deleted: 0, _peerdb_version: 18}
      - input: source('woocommerce_raw', 'woocommerce_order_items')
        rows: []
      - input: source('woocommerce_raw', 'woocommerce_order_itemmeta')
        rows: []
    expect:
      rows:
        - {refund_id: 11, order_id: 1, refunded_amount: 10}
        - {refund_id: 12, order_id: 2, refunded_amount: '9.99'}
        - {refund_id: 13, order_id: 2, refunded_amount: '9.99'}
