name: dactopus_shopify
version: "0.13.0"
profile: dactopus
model-paths: ["models"]
macro-paths: ["macros"]
vars:
  # The database holding the input tables (input.sql).
  shopify_input_database: shopify_raw
  # The label every row carries as source_id: 1 to 64 of a-z, 0-9 and _.
  # Give each store its own, and the tables of several stores add up.
  # A new label needs a --full-refresh.
  shopify_source_id: shopify
  # The shop's time zone (Settings > General in the Shopify admin), for
  # order and refund dates; Shopify's reports use it.
  shopify_timezone: UTC
  # Each incremental run rereads the orders and refunds loaded (loaded_at)
  # in this many days before the latest load it has seen: an insert that
  # began before that load may commit after it.
  shopify_lookback_days: 3
models:
  dactopus_shopify:
    +materialized: incremental
    # Every model's columns and their types are listed in schema.yml; a
    # build stops on any other (tests/check_contracts.py).
    +contract: {enforced: true}
    +incremental_strategy: delete+insert
    # A release that changes a model's columns stops an incremental run
    # with an error rather than leave the old table: run it once with
    # --full-refresh, as UPGRADING.md says.
    +on_schema_change: fail
    # An INSERT ... SELECT buffers the rows per insert thread, up to
    # min_insert_block_size_bytes each, before it sorts and writes a part:
    # with the defaults, 256 MB times the server's cores, while a full build
    # holds its output and the models' own work on top. One insert thread
    # and smaller blocks bound it (the full build of orders for 2 million
    # orders peaks at 1.2 GiB instead of 1.6; it is about twice as slow); an
    # incremental run inserts few rows and is not affected. They go on the
    # INSERT here: the contract wraps a model's SELECT in a subquery, whose
    # own SETTINGS do not reach the insert.
    +query_settings:
      max_insert_threads: 1
      min_insert_block_size_rows: 262144
      min_insert_block_size_bytes: 67108864
    # The settings guard (macros/settings.sql): an incremental run whose
    # table was built with other values of guarded_vars stops before it
    # reads or deletes a row, and a full refresh records the new ones. Each
    # variable of vars above is in guarded_vars, with its default there
    # too, or in free_vars, which any run may change: they name where the
    # same rows are read from, or only widen the window a run rereads
    # (tests/check_contracts.py).
    +pre-hook: "{{ dactopus_check_settings() }}"
    +post-hook: "{{ dactopus_save_settings() }}"
    +meta:
      guarded_vars:
        shopify_source_id: shopify
        shopify_timezone: UTC
      free_vars: [shopify_input_database, shopify_lookback_days]
