name: dactopus_ga4
version: "0.8.0"
profile: dactopus
model-paths: ["models"]
macro-paths: ["macros"]
vars:
  # The database holding the input table events (input.sql).
  ga4_input_database: ga4_raw
  # GA4 keeps updating a daily export table for up to 72 hours after its date:
  # https://support.google.com/analytics/answer/9358801
  ga4_lookback_days: 3
models:
  dactopus_ga4:
    +materialized: incremental
    # Every model's columns and their types are listed in schema.yml; a
    # build stops on any other (tests/check_contracts.py).
    +contract: {enforced: true}
    +incremental_strategy: delete+insert
    # A release that changes a model's columns stops an incremental run
    # with an error rather than leave the old table: run it once with
    # --full-refresh, as the CHANGELOG says.
    +on_schema_change: fail
