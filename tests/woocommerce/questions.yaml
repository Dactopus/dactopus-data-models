# The questions the commerce model must answer over the package's fixture, and the
# rows of each answer, derived by hand. A case: metrics, dimensions, filters and
# order (lists, left out when empty), limit, and expected. window_cases are asked
# over the fixture with windows.sql. The questions are asked in time_zone, the
# zone of the build.
time_zone: America/New_York
cases:
  # revenue = the counted orders' totals: 88 + 33 + 70.40 + 30.80 + 46 +
  # 33 + 66 + 16.50 + 66 = 449.70 over 9 orders (565.20 over all 13 rows,
  # if pending 106, cancelled 107, failed 108 and on-hold 102 counted;
  # 114, 115 and 116 in it would make 631.20). 117 is 59.40 EUR at 0.9 EUR
  # per USD: 66 (59.40 if left in EUR). refunded_amount: 29.70 (104) + 33
  # (111) + 5 (112) = 67.70; net_revenue = 449.70 - 67.70 = 382, as
  # Analytics' total sales. average_order_value = goods after discounts
  # over orders, as Analytics' (and Shopify's) average order value: total
  # less shipping and tax, fees in: 70 + 25 + 54 + 18 (109: 20 + 5 - 7)
  # + 31.82 (110) + 20 + 60 + 10 + 50 = 338.82 over 9. Discounts: 104's
  # coupon, 6 without tax. Shipping without tax: 10 + 5 + 10 + 10 + 10 +
  # 10 + 0 + 5 + 10 (117's 9 EUR) = 70. Tax on goods and shipping: 8 + 3
  # + 6.40 + 2.80 + 4.18 + 3 + 6 + 1.50 + 6 = 40.88 (33.88 if tax_amount,
  # which leaves shipping tax out, were taken alone). Customers 1, 2 and
  # -112, guest4 (112); 2 if guests were not counted.
  # orders.refund_rate is 67.7 / 449.7 written out in full precision
  # orders.average_order_value is 338.82 / 9 written out in full precision
  - metrics: [orders.order_count, orders.revenue, orders.refunded_amount, sales_events.net_revenue,
              orders.refund_rate, orders.average_order_value, orders.discount_amount,
              orders.shipping_amount, orders.tax_amount, orders.buyer_count]
    expected:
      - {orders.order_count: 9, orders.revenue: 449.7, orders.refunded_amount: 67.7,
         sales_events.net_revenue: 382, orders.refund_rate: 0.15054480764954414,
         orders.average_order_value: 37.64666666666667, orders.discount_amount: 6,
         orders.shipping_amount: 70, orders.tax_amount: 40.88, orders.buyer_count: 3}
  # Every row of orders, counted or not: the 9 above and 102 (16.50), 106
  # (22), 107 (44), 108 (33), 118 (22), 119 (22): 15 orders, 609.20. Not
  # 18: the trash, the checkout draft and the deleted order are not
  # orders.
  - metrics: [orders.all_orders, orders.all_orders_total]
    expected:
      - {orders.all_orders: 15, orders.all_orders_total: 609.2}
  # Orders waiting for payment: 102, 118 and 119 on hold (16.50, 22, 22)
  # and 106 pending (22). The counted metrics have none: orders would
  # answer 0.
  - metrics: [orders.all_orders, orders.all_orders_total]
    filters: ["orders.financial_status = 'unpaid'"]
    expected:
      - {orders.all_orders: 4, orders.all_orders_total: 82.5}
  # Which rows the reports count.
  - metrics: [orders.all_orders]
    dimensions: [orders.in_sales_reports]
    order: [orders.in_sales_reports]
    expected:
      - {in_sales_reports: false, orders.all_orders: 6}
      - {in_sales_reports: true, orders.all_orders: 9}
  # By month of payment in New York. August: 101 88, 103 33 (September in
  # UTC). September: 104 70.40 (August by date placed), 109 30.80, 110 46,
  # 111 33; net 180.20 - 29.70 - 33 = 117.50, refunds by the month of their
  # order, 104's refund of October 5 included. October: 112 66, 113 16.50
  # (October 3 if dated when placed, and not counted in its earlier
  # version), 117 66; net 148.50 - 5.
  - metrics: [orders.order_count, orders.revenue, sales_events.net_revenue, orders.refunded_amount]
    dimensions: [orders.order_month]
    order: [orders.order_month]
    expected:
      - {order_month: "2026-08-01", orders.order_count: 2, orders.revenue: 121,
         sales_events.net_revenue: 121, orders.refunded_amount: 0}
      - {order_month: "2026-09-01", orders.order_count: 4, orders.revenue: 180.2,
         sales_events.net_revenue: 117.5, orders.refunded_amount: 62.7}
      - {order_month: "2026-10-01", orders.order_count: 3, orders.revenue: 148.5,
         sales_events.net_revenue: 143.5, orders.refunded_amount: 5}
  # Paid before midnight of September 1, a time without an offset, which is
  # read in the zone the model is served in, New York: August's 101 88 and
  # 103 33 (22:10 on August 31). Served in UTC, 103 (02:10 on September 1
  # there) is not there: 1 order, 88. A plain string reads as the TIMESTAMP
  # literal does.
  - metrics: [orders.order_count, orders.revenue]
    filters: ["orders.order_time < TIMESTAMP '2026-09-01 00:00:00'"]
    expected:
      - {orders.order_count: 2, orders.revenue: 121}
  - metrics: [orders.order_count, orders.revenue]
    filters: ["orders.order_time < '2026-09-01 00:00:00'"]
    expected:
      - {orders.order_count: 2, orders.revenue: 121}
  # Sales by the month they happened, as the store's reports count them:
  # each order in the month of its payment, each refund in its own month.
  # August 101 88 + 103 33 = 121. September 104 70.40 + 109 30.80 + 110
  # 46 + 111 33 - refund 902 33 = 147.20. October 112 66 + 113 16.50 +
  # 117 66 - 903 5 - 901 29.70 = 113.80. 382 in all, as net_revenue by
  # the month of the order above (121, 117.50, 143.50), where 901 is
  # September's. Refund 904 of cancelled 107 would take 22 off September.
  - metrics: [sales_events.net_revenue]
    dimensions: [sales_events.event_month]
    order: [sales_events.event_month]
    expected:
      - {event_month: "2026-08-01", sales_events.net_revenue: 121}
      - {event_month: "2026-09-01", sales_events.net_revenue: 147.2}
      - {event_month: "2026-10-01", sales_events.net_revenue: 113.8}
  # The same sales by kind of event: the 9 counted orders, 449.70, less
  # their refunds, 67.70. WooCommerce has no cancellation events: a
  # cancelled order is left out by its status.
  - metrics: [sales_events.net_revenue]
    dimensions: [sales_events.event_type]
    order: [sales_events.event_type]
    expected:
      - {event_type: "order", sales_events.net_revenue: 449.7}
      - {event_type: "refund", sales_events.net_revenue: -67.7}
  # Refunds by the month they were made: 902 (111, 33) on September 22;
  # 903 (112, 5, an amount without lines) on October 2 and 901 (104,
  # 29.70) on October 5. 904 (107, 22, September 10) is a refund of an
  # order the reports leave out, and they leave it out too: with it
  # September would be 2 refunds, 55.
  - metrics: [refund_count, refunds_total]
    dimensions: [refunds.refund_month]
    order: [refunds.refund_month]
    expected:
      - {refund_month: "2026-09-01", refund_count: 1, refunds_total: 33}
      - {refund_month: "2026-10-01", refund_count: 2, refunds_total: 34.7}
  # Payment state of every row. Paid: 101, 103, 109, 110, 113 (its
  # earlier version, processing without a payment date, would be unpaid),
  # 117. Partially refunded: 104, 112, and 107, paid before it was
  # cancelled and refunded in part after. Refunded: 111. Unpaid: 102, 118
  # and 119 on hold, 106 pending. Voided: 108,
  # its payment failed.
  - metrics: [orders.all_orders]
    dimensions: [orders.financial_status]
    order: [orders.financial_status]
    expected:
      - {financial_status: "paid", orders.all_orders: 6}
      - {financial_status: "partially_refunded", orders.all_orders: 3}
      - {financial_status: "refunded", orders.all_orders: 1}
      - {financial_status: "unpaid", orders.all_orders: 4}
      - {financial_status: "voided", orders.all_orders: 1}
  # Completed orders are fulfilled: 101, 104, 109, 112, 113. The rest are
  # not, processing 103, 110 and 117, refunded 111 and the orders on hold
  # among them.
  - metrics: [orders.all_orders]
    dimensions: [orders.fulfillment_status]
    order: [orders.fulfillment_status]
    expected:
      - {fulfillment_status: "fulfilled", orders.all_orders: 5}
      - {fulfillment_status: "unfulfilled", orders.all_orders: 10}
  # The customer's orders by date placed, as Analytics ranks them, orders
  # of excluded statuses skipped and orders on hold numbered, the
  # counted orders shown: customer 1's 101, 104, 109, 111, 117; customer
  # 2's 102 (a guest's on hold, billed to customer 2's email), 103, 110,
  # 113 (cancelled 107 skipped; counting it, 110 and 113 would be 4 and
  # 5); guest4's 118 (on hold) and 112. Number 1: 101 88 (102 and 118 are
  # on hold, not counted); 2: 104 70.40, 103 33, 112 66; 3: 109 30.80, 110
  # 46; 4: 111 33, 113 16.50; 5: 117 66. Every counted order has a
  # customer: the empty row has none, only 106, 107 and 108, which the
  # reports leave out. Were guests left out, 112 would have no number and
  # 103, 110 and 113 would be 1, 2 and 3.
  - metrics: [orders.order_count, orders.revenue]
    dimensions: [orders.customer_order_number]
    order: [orders.customer_order_number]
    expected:
      - {customer_order_number: 1, orders.order_count: 1, orders.revenue: 88}
      - {customer_order_number: 2, orders.order_count: 3, orders.revenue: 169.4}
      - {customer_order_number: 3, orders.order_count: 2, orders.revenue: 76.8}
      - {customer_order_number: 4, orders.order_count: 2, orders.revenue: 49.5}
      - {customer_order_number: 5, orders.order_count: 1, orders.revenue: 66}
      - {customer_order_number: null, orders.order_count: 0, orders.revenue: 0}
  # New: 101. Repeat: 104 70.40, 103 33, 112 66, 109 30.80, 110 46, 111
  # 33, 113 16.50, 117 66 = 361.70. None: no counted order.
  - metrics: [orders.order_count, orders.revenue]
    dimensions: [orders.new_vs_repeat]
    order: [orders.new_vs_repeat]
    expected:
      - {new_vs_repeat: "new", orders.order_count: 1, orders.revenue: 88}
      - {new_vs_repeat: "repeat", orders.order_count: 8, orders.revenue: 361.7}
      - {new_vs_repeat: null, orders.order_count: 0, orders.revenue: 0}
  # Repeat orders over the counted orders with a customer: 8 / 9.
  # orders.repeat_order_share is 8 / 9 written out in full precision
  - metrics: [orders.repeat_order_share]
    expected:
      - {orders.repeat_order_share: 0.8888888888888888}
  # Lines of the counted orders: 101 2 mugs (1 before its edit) + 1 tee,
  # 103 1, 104 2, 109 1 (its removed sticker line gone), 110 1, 111 1, 112
  # 2, 113 2, 117 2 = 15 items; 13 left after 104's refunded tee and 111's
  # mug. A refund's own lines (negative quantities) are not lines of goods:
  # with them 15 would be 13. Line totals without tax: 40 + 30 + 25 + 54 +
  # 20 + 31.818182 + 20 + 60 + 10 + 50 (117's 45 EUR) = 340.818182; the
  # orders' subtotal is 338.82 with 109's fees of -2.
  # orders.items_per_order is 15 / 9 written out in full precision
  - metrics: [items_sold, items_net, line_revenue, orders.items_per_order]
    expected:
      - {items_sold: 15, items_net: 13, line_revenue: 340.818182,
         orders.items_per_order: 1.6666666666666667}
  # Top SKU by items: MUG 2 (101) + 1 (109) + 1 (111) + 2 (117) = 6. A
  # line keeps no SKU; it gets its product's current one, the variation's
  # for a tee: TEE-M 4, TEE-L 2. The sticker has none and the cap was
  # deleted: 3 items without a SKU.
  - metrics: [items_sold]
    dimensions: [order_lines.sku]
    order: ["items_sold desc"]
    limit: 2
    expected:
      - {sku: "MUG", items_sold: 6}
      - {sku: "TEE-M", items_sold: 4}
  # By shipping country: CA 110 46; DE 117 66; US 101, 103, 104, 109, 111,
  # 113 = 271.70; no shipping address 112 (billing only), 66.
  - metrics: [orders.order_count, orders.revenue]
    dimensions: [orders.shipping_country]
    order: [orders.shipping_country]
    expected:
      - {shipping_country: "CA", orders.order_count: 1, orders.revenue: 46}
      - {shipping_country: "DE", orders.order_count: 1, orders.revenue: 66}
      - {shipping_country: "US", orders.order_count: 6, orders.revenue: 271.7}
      - {shipping_country: null, orders.order_count: 1, orders.revenue: 66}
  # Every amount is in the store's currency, 117 converted: one currency.
  - metrics: [orders.order_count]
    dimensions: [orders.currency]
    expected:
      - {currency: "USD", orders.order_count: 9}
  # Every order is of one platform, the package's.
  - metrics: [orders.order_count]
    dimensions: [orders.platform]
    expected:
      - {platform: "woocommerce", orders.order_count: 9}
  # Without a plugin's number, the order number is the id: 101's meta
  # holds a plugin's 1, which the package reads only when told its key.
  - metrics: [orders.order_count]
    dimensions: [orders.order_number]
    filters: ["orders.order_id = 101"]
    expected:
      - {order_number: "101", orders.order_count: 1}
  # Products. Lines of the counted orders as in line_revenue above, each
  # in every one of its product's latest categories and brands; returns
  # are the refunds' lines (904's, of cancelled 107, left out with its
  # order), by the month of the order: 104's tee 27 and 111's mug 20, 2
  # items, 47; net 340.818182 - 47 = 293.818182.
  - metrics: [items_returned, line_returned_amount, line_net_revenue]
    expected:
      - {items_returned: 2, line_returned_amount: 47, line_net_revenue: 293.818182}
  # By category, the product's own ones, as Analytics' Categories report
  # counts them, without a filter; a category is told apart by its path,
  # as two are named Accessories. Gifts, Kitchen & Dining and Kitchen &
  # Dining > Accessories all have the Mug, 40 + 20 + 20 + 50 = 130 over 6
  # items, 111's mug returned (20): net 110 each. Clothing > T-Shirts the
  # Tee, 30 + 54 + 31.818182 + 60 = 175.818182 over 6 items, 104's tee
  # returned (27): net 148.818182. Uncategorized the Sticker pack, 113's
  # 10 over 2 items (102 is on hold, not counted); it is in the trash now
  # and keeps its terms. None: the Cap (deleted, its terms gone with it),
  # 25. Clothing has 0: the Tee is in T-Shirts under it, not in Clothing
  # itself; counted with the rows above the product's categories, it
  # would have the Tee's 175.818182. Clothing > Accessories has no row:
  # the Tote never sold. The categories add up to 600.818182, the Mug's
  # 130 twice more than line_revenue's 340.818182. Read with the old
  # name, Kitchen would have the Mug's 130; with the Sticker's old link,
  # Gifts would have 140 over 8 items; joined on term_id, the Sticker
  # pack's 10 would be in Accessories and no other line would have a
  # category.
  - metrics: [category_items_sold, category_revenue, category_items_returned,
              category_returned_amount, category_net_revenue]
    dimensions: [line_categories.category_path]
    order: [line_categories.category_path]
    expected:
      - {category_path: "Clothing", category_items_sold: 0, category_revenue: 0,
         category_items_returned: 0, category_returned_amount: 0, category_net_revenue: 0}
      - {category_path: "Clothing > T-Shirts", category_items_sold: 6,
         category_revenue: 175.818182, category_items_returned: 1, category_returned_amount: 27,
         category_net_revenue: 148.818182}
      - {category_path: "Gifts", category_items_sold: 6, category_revenue: 130,
         category_items_returned: 1, category_returned_amount: 20, category_net_revenue: 110}
      - {category_path: "Kitchen & Dining", category_items_sold: 6, category_revenue: 130,
         category_items_returned: 1, category_returned_amount: 20, category_net_revenue: 110}
      - {category_path: "Kitchen & Dining > Accessories", category_items_sold: 6,
         category_revenue: 130, category_items_returned: 1, category_returned_amount: 20,
         category_net_revenue: 110}
      - {category_path: "Uncategorized", category_items_sold: 2, category_revenue: 10,
         category_items_returned: 0, category_returned_amount: 0, category_net_revenue: 10}
      - {category_path: null, category_items_sold: 1, category_revenue: 25,
         category_items_returned: 0, category_returned_amount: 0, category_net_revenue: 25}
  # One category with its subcategories, as Analytics' filter by category
  # takes them: the lines' metrics filtered by the category, each line
  # once. Clothing the Tee through T-Shirts, 175.818182 over 6 items, 1
  # returned for 27, net 148.818182; Kitchen & Dining the Mug, 130 over 6,
  # net 110, not 260 over 12 for its two categories there. Read with
  # T-Shirts' parent before September 10 (none), or with the parent
  # matched to term_taxonomy_id, Clothing would have nothing.
  - metrics: [items_sold, line_revenue, items_returned, line_returned_amount, line_net_revenue]
    filters: ["line_categories.category_path = 'Clothing'"]
    expected:
      - {items_sold: 6, line_revenue: 175.818182, items_returned: 1, line_returned_amount: 27,
         line_net_revenue: 148.818182}
  - metrics: [items_sold, line_revenue, line_net_revenue]
    filters: ["line_categories.category_path = 'Kitchen & Dining'"]
    expected:
      - {items_sold: 6, line_revenue: 130, line_net_revenue: 110}
  # September by category: Gifts, Kitchen & Dining and its Accessories
  # 109's 20 + 111's 20 = 40, net 20 each; T-Shirts 104's 54 + 110's
  # 31.818182 = 85.818182, net 58.818182; Clothing, above T-Shirts, 0.
  - metrics: [category_revenue, category_net_revenue]
    dimensions: [line_categories.category_path]
    filters: ["orders.order_month = DATE '2026-09-01'"]
    order: [line_categories.category_path]
    expected:
      - {category_path: "Clothing", category_revenue: 0, category_net_revenue: 0}
      - {category_path: "Clothing > T-Shirts", category_revenue: 85.818182,
         category_net_revenue: 58.818182}
      - {category_path: "Gifts", category_revenue: 40, category_net_revenue: 20}
      - {category_path: "Kitchen & Dining", category_revenue: 40, category_net_revenue: 20}
      - {category_path: "Kitchen & Dining > Accessories", category_revenue: 40,
         category_net_revenue: 20}
  # By brand: Acme the Tee and the Sticker pack, 175.818182 + 10 =
  # 185.818182 over 8 items, 1 returned for 27; Northwind the Tee,
  # 175.818182 over 6, 1 returned for 27; none the Mug and the Cap, 130 +
  # 25 = 155 over 7, 1 returned for 20. Beta, deleted, has nothing; read
  # with it, it would have the Tee's 175.818182.
  - metrics: [brand_items_sold, brand_revenue, brand_items_returned, brand_returned_amount,
              brand_net_revenue]
    dimensions: [line_brands.brand]
    order: [line_brands.brand]
    expected:
      - {brand: "Acme", brand_items_sold: 8, brand_revenue: 185.818182, brand_items_returned: 1,
         brand_returned_amount: 27, brand_net_revenue: 158.818182}
      - {brand: "Northwind", brand_items_sold: 6, brand_revenue: 175.818182,
         brand_items_returned: 1, brand_returned_amount: 27, brand_net_revenue: 148.818182}
      - {brand: null, brand_items_sold: 7, brand_revenue: 155, brand_items_returned: 1,
         brand_returned_amount: 20, brand_net_revenue: 135}
  # Brand by month: Acme August 30 (101's tee), September 85.818182,
  # October 60 + 10 = 70; Northwind August 30, September 85.818182,
  # October 60; none August 40 + 25 = 65, September 40, October 50.
  - metrics: [brand_revenue]
    dimensions: [line_brands.brand, orders.order_month]
    order: [line_brands.brand, orders.order_month]
    expected:
      - {brand: "Acme", order_month: "2026-08-01", brand_revenue: 30}
      - {brand: "Acme", order_month: "2026-09-01", brand_revenue: 85.818182}
      - {brand: "Acme", order_month: "2026-10-01", brand_revenue: 70}
      - {brand: "Northwind", order_month: "2026-08-01", brand_revenue: 30}
      - {brand: "Northwind", order_month: "2026-09-01", brand_revenue: 85.818182}
      - {brand: "Northwind", order_month: "2026-10-01", brand_revenue: 60}
      - {brand: null, order_month: "2026-08-01", brand_revenue: 65}
      - {brand: null, order_month: "2026-09-01", brand_revenue: 40}
      - {brand: null, order_month: "2026-10-01", brand_revenue: 50}
  # Average order value of the orders with a line in Gifts, each order
  # once, all of its goods: the Mug's orders 101 70 (its tee included),
  # 109 18 (with its fees), 111 20, 117 50 = 158 over 4; counted once per
  # category of the line, Gifts or Kitchen & Dining would give 316 over 8.
  # Clothing, with its subcategories: 101 70, 104 54, 110 31.82, 112 60 =
  # 215.82 over 4, the same as T-Shirts.
  # orders.average_order_value is 158 / 4 written out in full precision
  - metrics: [orders.average_order_value, orders.order_count]
    filters: ["line_categories.category_path = 'Gifts'"]
    expected:
      - {orders.average_order_value: 39.5, orders.order_count: 4}
  # orders.average_order_value is 215.82 / 4 written out in full precision
  - metrics: [orders.average_order_value, orders.order_count]
    filters: ["line_categories.category_path = 'Clothing'"]
    expected:
      - {orders.average_order_value: 53.955, orders.order_count: 4}
  # Catalog: 4 products (11, 12, 15, 16); the Cap is deleted, the Sticker
  # pack (13) and the Notebook (17) are in the trash, and the variations
  # 121 and 122, the page and the orders' placeholders are no products.
  # Active (published) 3, draft 1 (16).
  - metrics: [products.product_count]
    dimensions: [products.status]
    order: [products.status]
    expected:
      - {status: "active", products.product_count: 3}
      - {status: "draft", products.product_count: 1}
  # Lines by the product's status now, as in line_revenue above: active
  # the Tee 175.818182 and the Mug 130 = 305.818182 over 12 items; empty
  # the Sticker pack 10 over 2 (in the trash, so out of the catalog,
  # though line_categories keeps it in Uncategorized) and the Cap 25
  # over 1 (deleted) = 35 over 3. 340.818182 in all, as line_revenue.
  - metrics: [line_revenue, items_sold]
    dimensions: [products.status]
    order: [products.status]
    expected:
      - {status: "active", line_revenue: 305.818182, items_sold: 12}
      - {status: null, line_revenue: 35, items_sold: 3}
  # Active by category: Clothing 0 (its products are in its
  # subcategories), Clothing > Accessories 1 (15), Clothing > T-Shirts 1
  # (12), Gifts 2 (11, 15), Kitchen & Dining 1 (11), Kitchen & Dining >
  # Accessories 1 (11); by name, Accessories would have 2.
  - metrics: [product_categories.product_count]
    dimensions: [product_categories.category_path]
    filters: ["products.status = 'active'"]
    order: [product_categories.category_path]
    expected:
      - {category_path: "Clothing", product_categories.product_count: 0}
      - {category_path: "Clothing > Accessories", product_categories.product_count: 1}
      - {category_path: "Clothing > T-Shirts", product_categories.product_count: 1}
      - {category_path: "Gifts", product_categories.product_count: 2}
      - {category_path: "Kitchen & Dining", product_categories.product_count: 1}
      - {category_path: "Kitchen & Dining > Accessories", product_categories.product_count: 1}
  # With subcategories, the catalog filtered by the category: Clothing 2
  # (12, 15), Kitchen & Dining 1 (11, in it twice; the Apron, 16, is a
  # draft).
  - metrics: [products.product_count]
    filters: ["products.status = 'active'", "product_categories.category_path = 'Clothing'"]
    expected:
      - {products.product_count: 2}
  - metrics: [products.product_count]
    filters: ["products.status = 'active'",
              "product_categories.category_path = 'Kitchen & Dining'"]
    expected:
      - {products.product_count: 1}
  # By brand: Acme the Tee and the Tote (the Sticker pack is in the
  # trash), Northwind the Tee.
  - metrics: [product_brands.product_count]
    dimensions: [product_brands.brand]
    order: [product_brands.brand]
    expected:
      - {brand: "Acme", product_brands.product_count: 2}
      - {brand: "Northwind", product_brands.product_count: 1}
  # Last sold, by the order's date: Mug October 9 (117), Tee October 1
  # (112); never sold: 15, 16. The Sticker pack's October 6 (113) is out
  # with it, and 114 (trash) and 116 (deleted) do not count.
  - dimensions: [products.product_id, products.last_sold_date]
    order: [products.product_id]
    expected:
      - {product_id: 11, last_sold_date: "2026-10-09"}
      - {product_id: 12, last_sold_date: "2026-10-01"}
      - {product_id: 15, last_sold_date: null}
      - {product_id: 16, last_sold_date: null}
  # A customer is one as WooCommerce Analytics counts them: the account
  # of a registered order; for a guest's, the billing email in any case,
  # joined to the account that has an order with that email; a guest's
  # order without an email is a customer of its own, as Analytics makes it
  # (local test store). A guest's number is the smallest id of their
  # orders, negative: -112 for guest4, whose first order is 118. A
  # customer's orders are the ones the report of new and returning
  # customers counts: every status but the excluded ones (on hold
  # included, paid or not), by date placed. Dates and months are New
  # York's, of the date placed.
  #   1     first order 101, August 10: cohort August. Last 117, October
  #         9. 5 orders, net 88 + (70.40 - 29.70) + 30.80 + (33 - 33) + 66
  #         = 225.50.
  #   2     first order 102, August 20, on hold, before customer 2's first
  #         order as a customer: cohort August. Analytics joins it to the
  #         account the same way if the account was made on the order
  #         confirmation page; after a sign-up anywhere else it keeps 102
  #         as a guest of its own (local test store), and customer 2
  #         would start with 103. Last 113, placed October 3 (paid
  #         October 6). 4 orders, net 16.50 + 33 + 46 + 16.50 = 112
  #         (cancelled 107 and its refund left out).
  #   -112  guest4: first order 118, September 28, on hold: cohort
  #         September. Last 112, October 1. 2 orders, net 22 + (66 - 5) =
  #         83.
  #   -119  119, without an email: first and last order September 30, on
  #         hold: cohort September. 1 order, net 22.
  # No customer for 106 (pending) and 108 (failed): no order counted. Net
  # includes the orders on hold, as the Customers report's total spend:
  # with 102, 118 and 119 the customers make 442.50 against
  # net_revenue's 382. By cohort: August (225.50 + 112) / 2 = 168.75,
  # September (83 + 22) / 2 = 52.50.
  - metrics: [customers.customer_count, customers.net_amount, customers.average_customer_value]
    dimensions: [customers.first_order_month]
    order: [customers.first_order_month]
    expected:
      - {first_order_month: "2026-08-01", customers.customer_count: 2, customers.net_amount: 337.5,
         customers.average_customer_value: 168.75}
      - {first_order_month: "2026-09-01", customers.customer_count: 2, customers.net_amount: 105,
         customers.average_customer_value: 52.5}
  - metrics: [customers.net_amount]
    dimensions: [customers.customer_id, customers.first_order_date, customers.last_order_date,
                 customers.number_of_orders]
    order: [customers.customer_id]
    expected:
      - {customer_id: -119, first_order_date: "2026-09-30", last_order_date: "2026-09-30",
         number_of_orders: 1, customers.net_amount: 22}
      - {customer_id: -112, first_order_date: "2026-09-28", last_order_date: "2026-10-01",
         number_of_orders: 2, customers.net_amount: 83}
      - {customer_id: 1, first_order_date: "2026-08-10", last_order_date: "2026-10-09",
         number_of_orders: 5, customers.net_amount: 225.5}
      - {customer_id: 2, first_order_date: "2026-08-20", last_order_date: "2026-10-03",
         number_of_orders: 4, customers.net_amount: 112}
  # Bought once: -119.
  - metrics: [customers.customer_count]
    filters: ["customers.number_of_orders = 1"]
    expected:
      - {customers.customer_count: 1}
  # Buyers 3 (1, 2 and -112), customers 4: -119's only order is on hold,
  # which the reports leave out.
  - metrics: [orders.buyer_count, customers.customer_count]
    expected:
      - {orders.buyer_count: 3, customers.customer_count: 4}
  # Days since the customer's previous order: 104 20 (August 10 to 30),
  # 109 13, 111 8, 117 19; 103 11 (August 20 to 31; 12 to September 1 in
  # UTC), 110 15, 113 18; 112 3. All repeat orders 107 / 8; second orders
  # 20, 11 and 3 days, 34 / 3.
  # orders.average_days_between_orders is 107 / 8 written out in full precision
  - metrics: [orders.average_days_between_orders]
    expected:
      - {orders.average_days_between_orders: 13.375}
  # orders.average_days_between_orders is 34 / 3 written out in full precision
  - metrics: [orders.average_days_between_orders]
    filters: ["orders.customer_order_number = 2"]
    expected:
      - {orders.average_days_between_orders: 11.333333333333334}
  # Months since the first order (-1 on the first, then calendar months,
  # as Shopify's): 101 -1, 104 0, 109 1, 111 1, 117 2; 102 -1, 103 0 (1 in
  # UTC), 110 1, 113 2; 118 -1, 112 1; 119 -1. Buyers among the counted
  # orders: -1 customer 1 alone (102, 118 and 119 are on hold), 0
  # customers 1 and 2, 1 customers 1, 2 and -112, 2 customers 1 and 2.
  # The excluded orders (106, 107, 108) have none.
  - metrics: [orders.buyer_count]
    dimensions: [orders.months_since_first_order]
    order: [orders.months_since_first_order]
    expected:
      - {months_since_first_order: -1, orders.buyer_count: 1}
      - {months_since_first_order: 0, orders.buyer_count: 2}
      - {months_since_first_order: 1, orders.buyer_count: 3}
      - {months_since_first_order: 2, orders.buyer_count: 2}
      - {months_since_first_order: null, orders.buyer_count: 0}
  # Buyers by cohort and the model's month of order (of payment, counted
  # orders): August cohort August 2 (101, 103), September 2 (104, 109,
  # 111; 110), October 2 (117; 113); September cohort September none (118
  # and 119 on hold, dated by the date placed), October 1 (112). 106 and
  # 108, guests' orders the reports leave out, have no cohort.
  - metrics: [orders.buyer_count]
    dimensions: [customers.first_order_month, orders.order_month]
    order: [customers.first_order_month, orders.order_month]
    expected:
      - {first_order_month: "2026-08-01", order_month: "2026-08-01", orders.buyer_count: 2}
      - {first_order_month: "2026-08-01", order_month: "2026-09-01", orders.buyer_count: 2}
      - {first_order_month: "2026-08-01", order_month: "2026-10-01", orders.buyer_count: 2}
      - {first_order_month: "2026-09-01", order_month: "2026-09-01", orders.buyer_count: 0}
      - {first_order_month: "2026-09-01", order_month: "2026-10-01", orders.buyer_count: 1}
      - {first_order_month: null, order_month: "2026-09-01", orders.buyer_count: 0}
window_cases:
  # Retention windows, asked with --windows over a database of their own:
  # the fixture and tests/woocommerce/windows.sql synced at once, with no
  # row synced now. A window is over when its last day, the first order's
  # date + N, ended before the day of the last sync of orders: 2010's at
  # 23:00 on October 9 in New York (03:00 on October 10 in UTC). The second
  # order counts by the days between the dates placed in New York
  # (orders.days_since_previous_order), up to N included; a failed or
  # pending order is none.
  #   -2011  first March 2, 2026, second 18 days later, the email in other
  #          case: 30, 60, 90 yes; 365 ends March 2, 2027, empty
  #   -119   first September 30, alone; -112 first September 28, second 3
  #          days later: all empty (30 ends October 30 and 28)
  #   1      first August 10, second 20 days later: 30 over (September 9),
  #          yes; 60 ends October 9, the day of the last sync, empty
  #   2      first August 20 (102, a guest's), second 11 days later: 30 yes;
  #          60 ends October 19, empty
  #   11     first September 1, 2025, second 334 days later: 30, 60, 90 no;
  #          365 over (September 1, 2026), yes
  #   12     first October 8, 2025, alone: all four over, no (365 ended
  #          October 8, the day before the last sync)
  #   13     first October 9, 2025, alone: 30, 60, 90 no; 365 ends October
  #          9, empty (over, and no, by a UTC clock)
  #   14     first May 1, 2026, second 90 days later (failed 2006 between is
  #          none): 30, 60 no; 90 over (July 30), yes; 365 empty
  #   15     first June 1, 2026, second 44 days later (pending 2009 between
  #          is none): 30 no; 60 and 90 yes; 365 empty
  # Rates among the customers whose window is over: 30 days 3 of 8 (-2011,
  # 1, 2 of those and 11 to 15), 60 days 2 of 6 (-2011, 15), 90 days 3 of 6
  # (-2011, 14, 15), 365 days 1 of 2 (11 of 11, 12). By cohort, 30 days:
  # March and August 1, September none over, empty; the rest 0.
  - metrics: [customers.customer_count]
    dimensions: [customers.customer_id, customers.second_order_within_30_days,
                 customers.second_order_within_60_days, customers.second_order_within_90_days,
                 customers.second_order_within_365_days]
    order: [customers.customer_id]
    expected:
      - {customer_id: -2011, second_order_within_30_days: 1, second_order_within_60_days: 1,
         second_order_within_90_days: 1, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: -119, second_order_within_30_days: null, second_order_within_60_days: null,
         second_order_within_90_days: null, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: -112, second_order_within_30_days: null, second_order_within_60_days: null,
         second_order_within_90_days: null, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: 1, second_order_within_30_days: 1, second_order_within_60_days: null,
         second_order_within_90_days: null, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: 2, second_order_within_30_days: 1, second_order_within_60_days: null,
         second_order_within_90_days: null, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: 11, second_order_within_30_days: 0, second_order_within_60_days: 0,
         second_order_within_90_days: 0, second_order_within_365_days: 1,
         customers.customer_count: 1}
      - {customer_id: 12, second_order_within_30_days: 0, second_order_within_60_days: 0,
         second_order_within_90_days: 0, second_order_within_365_days: 0,
         customers.customer_count: 1}
      - {customer_id: 13, second_order_within_30_days: 0, second_order_within_60_days: 0,
         second_order_within_90_days: 0, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: 14, second_order_within_30_days: 0, second_order_within_60_days: 0,
         second_order_within_90_days: 1, second_order_within_365_days: null,
         customers.customer_count: 1}
      - {customer_id: 15, second_order_within_30_days: 0, second_order_within_60_days: 1,
         second_order_within_90_days: 1, second_order_within_365_days: null,
         customers.customer_count: 1}
  # customers.second_order_rate_30_days is 3 / 8 written out in full precision
  # customers.second_order_rate_60_days is 2 / 6 written out in full precision
  # customers.second_order_rate_90_days is 3 / 6 written out in full precision
  # customers.second_order_rate_365_days is 1 / 2 written out in full precision
  - metrics: [customers.second_order_rate_30_days, customers.second_order_rate_60_days,
              customers.second_order_rate_90_days, customers.second_order_rate_365_days]
    expected:
      - {customers.second_order_rate_30_days: 0.375,
         customers.second_order_rate_60_days: 0.3333333333333333,
         customers.second_order_rate_90_days: 0.5, customers.second_order_rate_365_days: 0.5}
  - metrics: [customers.second_order_rate_30_days]
    dimensions: [customers.first_order_month]
    order: [customers.first_order_month]
    expected:
      - {first_order_month: "2025-09-01", customers.second_order_rate_30_days: 0}
      - {first_order_month: "2025-10-01", customers.second_order_rate_30_days: 0}
      - {first_order_month: "2026-03-01", customers.second_order_rate_30_days: 1}
      - {first_order_month: "2026-05-01", customers.second_order_rate_30_days: 0}
      - {first_order_month: "2026-06-01", customers.second_order_rate_30_days: 0}
      - {first_order_month: "2026-08-01", customers.second_order_rate_30_days: 1}
      - {first_order_month: "2026-09-01", customers.second_order_rate_30_days: null}
  # Customers whose 90 days are over without a second order: 11, 12, 13.
  - metrics: [customers.customer_count]
    filters: ["customers.second_order_within_90_days = false"]
    expected:
      - {customers.customer_count: 3}
