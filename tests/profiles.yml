# The profile CI and the checks build the packages with. A package ships
# none: whoever runs it gives dbt a profile named `dactopus`.
dactopus:
  target: default
  outputs:
    default:
      type: clickhouse
      # The database the canonical tables are written to.
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'dactopus') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      custom_settings:
        # The dbt v2 ClickHouse adapter (beta) decompresses LZ4 only, while
        # ClickHouse 26.x compresses HTTP responses with ZSTD by default.
        network_compression_method: LZ4
        # The opposite of ClickHouse's default: a LEFT JOIN without a match
        # gives NULL, not 0. The order packages set 0 in their own queries
        # and must build the same under either.
        join_use_nulls: 1
