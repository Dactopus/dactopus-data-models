<svg xmlns="http://www.w3.org/2000/svg" class="dm" viewBox="0 0 680 560" width="680" height="560" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">dactopus-data-models and the outside world</title>
<desc id="d-desc">The GA4 export and Shopify's orders are loaded into input tables in your ClickHouse. The dbt packages build the canonical tables: events, sessions and purchases; orders, order lines and refunds. BI tools read them directly; AI agents read them through ossie-clickhouse, which uses the Ossie models.</desc>
<style>
svg.dm {
  --d-bg: #ffffff; --d-muted: #5f5e5a; --d-arrow: #888780; --d-accent: #534ab7;
  --g-fill: #f1efe8; --g-stroke: #5f5e5a; --g-title: #444441; --g-sub: #5f5e5a;
  --p-fill: #eeedfe; --p-stroke: #534ab7; --p-title: #3c3489; --p-sub: #534ab7;
  --t-fill: #e1f5ee; --t-stroke: #0f6e56; --t-title: #085041; --t-sub: #0f6e56;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  svg.dm {
    --d-bg: #1f1e1d; --d-muted: #b4b2a9; --d-arrow: #888780; --d-accent: #afa9ec;
    --g-fill: #444441; --g-stroke: #b4b2a9; --g-title: #f1efe8; --g-sub: #d3d1c7;
    --p-fill: #3c3489; --p-stroke: #afa9ec; --p-title: #eeedfe; --p-sub: #cecbf6;
    --t-fill: #04342c; --t-stroke: #5dcaa5; --t-title: #e1f5ee; --t-sub: #9fe1cb;
  }
}
svg.dm .bg { fill: var(--d-bg); }
svg.dm .th { font-size: 14px; font-weight: 600; }
svg.dm .ts { font-size: 12px; }
svg.dm .arr { stroke: var(--d-arrow); stroke-width: 1.5; fill: none; }
svg.dm .gray rect { fill: var(--g-fill); stroke: var(--g-stroke); }
svg.dm .gray .th { fill: var(--g-title); }
svg.dm .gray .ts { fill: var(--g-sub); }
svg.dm .purple rect { fill: var(--p-fill); stroke: var(--p-stroke); }
svg.dm .purple .th { fill: var(--p-title); }
svg.dm .purple .ts { fill: var(--p-sub); }
svg.dm .teal rect { fill: var(--t-fill); stroke: var(--t-stroke); }
svg.dm .teal .th { fill: var(--t-title); }
svg.dm .teal .ts { fill: var(--t-sub); }
svg.dm .legend { fill: var(--d-muted); }
svg.dm .cta rect { fill: none; stroke: var(--d-accent); }
svg.dm .cta text { fill: var(--d-accent); font-size: 13px; font-weight: 600; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="560" rx="12"/>

<g class="teal" data-k="ch">
<rect x="40" y="126" width="600" height="160" rx="20" stroke-width="0.5"/>
<text class="th" x="620" y="150" text-anchor="end" dominant-baseline="central">Your ClickHouse</text>
<text class="ts" x="620" y="168" text-anchor="end" dominant-baseline="central">databases set by the deployment</text>
</g>

<g class="node gray" data-k="export">
<rect x="60" y="40" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="58" text-anchor="middle" dominant-baseline="central">GA4, Shopify</text>
<text class="ts" x="135" y="78" text-anchor="middle" dominant-baseline="central">export, Admin API</text>
</g>
<g class="node gray" data-k="transport">
<rect x="265" y="40" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Transport</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">recipe or any loader</text>
</g>
<line x1="210" y1="68" x2="262" y2="68" class="arr" marker-end="url(#arrow)"/>
<path d="M340 96 L340 112 L135 112 L135 183" class="arr" marker-end="url(#arrow)"/>

<g class="node gray" data-k="input">
<rect x="60" y="186" width="150" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="206" text-anchor="middle" dominant-baseline="central">Input tables</text>
<text class="ts" x="135" y="227" text-anchor="middle" dominant-baseline="central">raw events, orders</text>
<text class="ts" x="135" y="245" text-anchor="middle" dominant-baseline="central">schema: input.sql</text>
</g>
<g class="node purple" data-k="dbt">
<rect x="265" y="186" width="150" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="206" text-anchor="middle" dominant-baseline="central">dbt packages</text>
<text class="ts" x="340" y="227" text-anchor="middle" dominant-baseline="central">sources/ga4, shopify</text>
<text class="ts" x="340" y="245" text-anchor="middle" dominant-baseline="central">incremental, tested</text>
</g>
<g class="node gray" data-k="canon">
<rect x="470" y="186" width="150" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="206" text-anchor="middle" dominant-baseline="central">Canonical tables</text>
<text class="ts" x="545" y="227" text-anchor="middle" dominant-baseline="central">web analytics,</text>
<text class="ts" x="545" y="245" text-anchor="middle" dominant-baseline="central">orders and refunds</text>
</g>
<line x1="210" y1="224" x2="262" y2="224" class="arr" marker-end="url(#arrow)"/>
<line x1="415" y1="224" x2="467" y2="224" class="arr" marker-end="url(#arrow)"/>
<path d="M490 262 L490 306 L135 306 L135 327" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="262" x2="545" y2="327" class="arr" marker-end="url(#arrow)"/>

<g class="node gray" data-k="bi">
<rect x="60" y="330" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="348" text-anchor="middle" dominant-baseline="central">BI, dashboards</text>
<text class="ts" x="135" y="368" text-anchor="middle" dominant-baseline="central">read the tables</text>
</g>
<g class="node purple" data-k="model">
<rect x="265" y="330" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">Ossie models</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">one per domain</text>
</g>
<g class="node gray" data-k="oc">
<rect x="470" y="330" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="348" text-anchor="middle" dominant-baseline="central">ossie-clickhouse</text>
<text class="ts" x="545" y="368" text-anchor="middle" dominant-baseline="central">MCP, database in URL</text>
</g>
<line x1="415" y1="358" x2="467" y2="358" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="386" x2="545" y2="417" class="arr" marker-end="url(#arrow)"/>
<g class="node gray" data-k="agents">
<rect x="470" y="420" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="438" text-anchor="middle" dominant-baseline="central">AI agents</text>
<text class="ts" x="545" y="458" text-anchor="middle" dominant-baseline="central">Claude and others</text>
</g>

<g class="cta">
<rect x="60" y="430" width="270" height="36" rx="8" stroke-width="1"/>
<text x="195" y="448" text-anchor="middle" dominant-baseline="central">Open the interactive version ↗</text>
</g>

<g class="purple"><rect x="40" y="516" width="12" height="12" rx="2" stroke-width="0.5"/></g>
<text class="ts legend" x="60" y="522" dominant-baseline="central">in this repository</text>
<g class="teal"><rect x="230" y="516" width="12" height="12" rx="2" stroke-width="0.5"/></g>
<text class="ts legend" x="250" y="522" dominant-baseline="central">your ClickHouse</text>
<g class="gray"><rect x="410" y="516" width="12" height="12" rx="2" stroke-width="0.5"/></g>
<text class="ts legend" x="430" y="522" dominant-baseline="central">outside this repository</text>
</svg>
