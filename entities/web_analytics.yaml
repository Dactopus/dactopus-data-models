version: "0.3.0.dev0"

name: web_analytics
description: >
  Website behaviour of an online store: events, sessions and the purchases
  web analytics recorded. Built from Google Analytics 4 (GA4) by the
  GA4 source package.
ai_context:
  instructions: >
    Purchases and revenue here are what web analytics recorded on the site,
    not the store's orders: they miss purchases made with tracking blocked
    and may differ from the store's own figures. Say so when someone
    compares them with sales. One deployment can hold several GA4 properties
    (sites), each under its own source_id, a label the deployment chose,
    which may name the site or not; the model knows nothing else of it. When
    the question names or describes a site in any way (a name, a domain, a
    kind of site such as the shop or the blog), first get the labels:
    sessions.session_count by sessions.source_id. Take the label that names
    the site; when none clearly matches, list the labels and ask which is
    meant. Only a question that names no site means all of them; answer it
    without a word about properties unless a result shows more than one.
    Dates are in each property's own time zone; with properties in several
    zones, name the date you asked for. GA4 exports each day once, after it
    is over: usually in the afternoon of the following day in the property's
    time zone, sometimes later. The days after the latest date with rows
    (sessions.session_count by sessions.session_date over the last days, for
    each property) have not been exported or loaded yet: say up to which
    date the data reaches, and never report those days as days without
    visits or purchases. The latest date with rows is a whole day: GA4 can
    still add events that arrive late for up to three days after it, but a
    low count on that day is its traffic, not a partial export. When this
    model is served together with the commerce model, questions about sales,
    revenue, orders or average order value mean the store's figures there;
    answer them from it alone. Properties and stores have labels of their
    own, and the model does not link a property to a store. The metrics here
    answer what web analytics recorded, and a comparison of the two names
    both; any amount from here goes by purchases.currency or as
    purchases.gross_purchase_revenue_usd.

datasets:
  - name: sessions
    source: sessions
    primary_key: [source_id, session_key]
    description: >
      One row per visit to the site. A session ends after 30 minutes without
      activity; it belongs to the date it started on. Session and user
      counts are exact; the GA4 interface estimates them, so its numbers can
      be slightly different.
    ai_context:
      synonyms: [visits, sessions, traffic]
    fields:
      - name: source_id
        expression: {sql: source_id}
        description: >
          GA4 property the row comes from: the label the deployment gives it,
          which may name the site (help_center) or not, one value for every row of
          a property. Group by it to answer per property or to compare them.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [property, GA4 property, site, website]
      - name: session_key
        expression: {sql: session_key}
        description: Identifier of the session, unique across users.
        datatype: String
      - name: user_pseudo_id
        expression: {sql: user_pseudo_id}
        description: >
          Identifier of the browser on a device that made the visit. One person
          on a phone and a laptop is two of these.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [visitor, user, client id]
      - name: session_date
        expression: {sql: session_date}
        description: Date the session started, in its GA4 property's time zone.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [date, day, visit date]
      - name: session_week
        expression: {sql: "DATE_TRUNC('week', session_date)"}
        description: First day (Monday) of the week the session started in.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [week]
      - name: session_month
        expression: {sql: "DATE_TRUNC('month', session_date)"}
        description: First day of the month the session started in.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [month]
      - name: session_start_time
        expression: {sql: session_start_time}
        description: Time of the session's first event, UTC.
        datatype: DateTimeTz
        dimension: {is_time: true}
      - name: is_engaged
        expression: {sql: is_engaged = 1}
        description: >
          Whether GA4 counted the session as engaged: it lasted more than 10
          seconds, had a key event or viewed two or more pages.
        datatype: Boolean
        dimension: {is_time: false}
        ai_context:
          synonyms: [engaged, engaged session]
      - name: has_purchase
        expression: {sql: has_purchase = 1}
        description: Whether the session included at least one purchase.
        datatype: Boolean
        dimension: {is_time: false}
        ai_context:
          synonyms: [converted, converting session, bought]
      - name: page_views
        expression: {sql: page_views}
        description: Number of pages viewed in the session.
        datatype: Integer
      - name: source
        expression: {sql: source}
        description: >
          Where the session came from (google, newsletter, a referring site),
          credited like the GA4 interface's session source: the last
          non-direct click. In exports from before October 2024 it is the
          first source seen in the session, so a returning direct visit shows
          (direct) where GA4 would credit an earlier source. (not set) means
          no source was recorded. A source covers all its mediums: google
          is organic and paid search together; use source_medium or medium
          to tell them apart.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [traffic source, referrer, session source, utm_source]
      - name: medium
        expression: {sql: medium}
        description: >
          Kind of traffic: organic, cpc (paid search), referral, email,
          (none) for direct visits. Credited the same way as source.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [traffic medium, channel, utm_medium]
      - name: source_medium
        expression: {sql: "source || ' / ' || medium"}
        description: Source and medium together, as GA4 shows them (google / organic).
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [source / medium]
      - name: campaign
        expression: {sql: campaign}
        description: Marketing campaign of the session, credited the same way as source.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [utm_campaign, campaign name]
      - name: landing_page
        expression: {sql: landing_page}
        description: Full URL of the first page viewed in the session.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [entry page, landing URL]
      - name: device_category
        expression: {sql: device_category}
        description: desktop, mobile or tablet.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [device, device type, platform]
      - name: country
        expression: {sql: country}
        description: Country of the visitor, from the IP address.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [geo, location]
    metrics:
      - name: session_count
        expression: {sql: COUNT(*)}
        description: Number of visits.
        datatype: Integer
        ai_context:
          synonyms: [sessions, visits, traffic, number of sessions]
      - name: engaged_sessions
        expression: {sql: "COUNT(CASE WHEN is_engaged THEN 1 END)"}
        description: Number of engaged visits (see is_engaged).
        datatype: Integer
      - name: engagement_rate
        expression: {sql: "COUNT(CASE WHEN is_engaged THEN 1 END) * 1.0 / COUNT(*)"}
        description: Share of visits that were engaged, from 0 to 1.
        datatype: Float
        ai_context:
          synonyms: [engagement]
      - name: users
        expression: {sql: "COUNT(DISTINCT source_id || '/' || CAST(user_pseudo_id AS VARCHAR))"}
        description: >
          Number of distinct browsers on devices that visited. Not people:
          one person on two devices counts twice, and a browser that visited
          two GA4 properties counts in each, so sessions.users adds up
          across properties. The model does not match users across
          properties: never compare user_pseudo_id values of two properties,
          and say that how many browsers visited both cannot be answered.
        datatype: Integer
        ai_context:
          synonyms: [visitors, unique visitors, total users]
      - name: session_conversion_rate
        expression: {sql: "COUNT(CASE WHEN has_purchase THEN 1 END) * 1.0 / COUNT(*)"}
        description: >
          Share of visits that included a purchase, from 0 to 1. The default
          meaning of conversion rate, as in the Shopify dashboard: name the
          definition in the answer and mention sessions.user_conversion_rate
          by name, giving its value only if you queried it.
        datatype: Float
        ai_context:
          synonyms: [conversion rate, conversion, ecommerce conversion rate, session key event rate]
      - name: user_conversion_rate
        expression: {sql: "COUNT(DISTINCT CASE WHEN has_purchase THEN source_id || '/' || CAST(user_pseudo_id AS VARCHAR) END) * 1.0 / COUNT(DISTINCT source_id || '/' || CAST(user_pseudo_id AS VARCHAR))"}
        description: >
          Share of visitors (browsers on devices) who bought at least once in the
          period, from 0 to 1.
        datatype: Float
        ai_context:
          synonyms: [purchaser rate, user key event rate, buyer conversion]
      - name: page_view_count
        expression: {sql: SUM(page_views)}
        description: Number of pages viewed.
        datatype: Integer
        ai_context:
          synonyms: [page views, pageviews, views]

  - name: purchases
    source: purchases
    primary_key: [source_id, purchase_key]
    description: >
      One row per purchase recorded by web analytics. A thank-you page
      reloaded or opened twice sends the same purchase again; repeats with
      the same transaction id from the same user count once, as in GA4.
      Amounts (purchases.gross_purchase_revenue,
      average_gross_purchase_revenue, tax and shipping) are in the currency
      the site sent with each purchase (purchases.currency), which GA4 calls
      "local currency". Query them with purchases.currency as a dimension.
      With one currency, answer in it and name its code. With several, give
      each currency separately and offer
      purchases.gross_purchase_revenue_usd for a single total; never add up
      amounts in different currencies. Use
      purchases.gross_purchase_revenue_usd also when asked for US dollars.
      Name the currency by the code purchases.currency returns; do not guess
      a currency sign.
    ai_context:
      synonyms: [conversions, ecommerce purchases, web purchases]
    fields:
      - name: source_id
        expression: {sql: source_id}
        description: >
          GA4 property the row comes from: the label the deployment gives it,
          which may name the site (help_center) or not, one value for every row of
          a property. Group by it to answer per property or to compare them.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [property, GA4 property, site, website]
      - name: purchase_key
        expression: {sql: purchase_key}
        description: Identifier of the purchase.
        datatype: String
      - name: transaction_id
        expression: {sql: transaction_id}
        description: >
          Order number the site sent with the purchase. Empty when the site
          did not send one; such purchases cannot be matched to store orders.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [order id, order number]
      - name: session_key
        expression: {sql: session_key}
        description: Session the purchase happened in.
        datatype: String
      - name: purchase_date
        expression: {sql: purchase_date}
        description: Date of the purchase, in its GA4 property's time zone.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [date, order date, day]
      - name: purchase_week
        expression: {sql: "DATE_TRUNC('week', purchase_date)"}
        description: First day (Monday) of the week of the purchase.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [week]
      - name: purchase_month
        expression: {sql: "DATE_TRUNC('month', purchase_date)"}
        description: First day of the month of the purchase.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [month]
      - name: purchase_time
        expression: {sql: purchase_time}
        description: Time of the purchase, UTC.
        datatype: DateTimeTz
        dimension: {is_time: true}
      - name: revenue
        expression: {sql: revenue}
        description: >
          Order value as the site reported it, including tax and shipping, in
          the currency of the purchase (currency field, GA4 "local
          currency"). A store that sells in several currencies has values in
          different currencies. Empty when the site sent no value.
        datatype: Float
        ai_context:
          synonyms: [order value, purchase amount]
      - name: currency
        expression: {sql: currency}
        description: >
          Currency of the purchase's revenue, tax and shipping: the code the
          site sent with the purchase (ISO 4217, such as USD or EUR), as
          sent. Empty when the site sent none, usually for a purchase
          without a value.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [currency code, purchase currency]
      - name: revenue_usd
        expression: {sql: revenue_usd}
        description: >
          Order value converted to US dollars by Google. Google does not
          document the exchange rate it uses.
        datatype: Float
      - name: tax
        expression: {sql: tax}
        description: Tax in the order, in the same currency as revenue.
        datatype: Float
      - name: shipping
        expression: {sql: shipping}
        description: Shipping cost in the order, in the same currency as revenue.
        datatype: Float
    metrics:
      - name: purchase_count
        expression: {sql: COUNT(*)}
        description: Number of purchases recorded on the site.
        datatype: Integer
        ai_context:
          synonyms: [conversions, ecommerce purchases, number of purchases]
      - name: gross_purchase_revenue
        expression: {sql: SUM(revenue)}
        description: >
          Total value of purchases as the site sent them, in their currency
          (purchases.currency): GA4's gross purchase revenue. Refunds are
          not subtracted; GA4's "Purchase revenue" subtracts the refunds the
          site sent, so it is lower when there were any: say so when someone
          compares it with the GA4 interface. Amounts in different
          currencies are added as they are: break it down by
          purchases.currency, or use purchases.gross_purchase_revenue_usd
          for a single total. Purchases the site sent without a value add
          nothing.
        datatype: Float
        ai_context:
          synonyms: [purchase revenue, ecommerce revenue, tracked revenue, web revenue, GA4 revenue]
      - name: gross_purchase_revenue_usd
        expression: {sql: SUM(revenue_usd)}
        description: >
          Total value of purchases in US dollars, converted by Google; refunds
          are not subtracted, as in purchases.gross_purchase_revenue.
        datatype: Float
        ai_context:
          synonyms: [purchase revenue in dollars, USD purchase revenue, web revenue in USD]
      - name: average_gross_purchase_revenue
        expression: {sql: SUM(revenue) / COUNT(revenue)}
        description: >
          Average value of a purchase over purchases that have a value, in
          their currency (purchases.currency), refunds not subtracted; break it
          down by currency when there are several.
        datatype: Float
        ai_context:
          synonyms: [average purchase revenue, average purchase value]

  - name: events
    source: events
    description: >
      One row per action recorded on the site: page_view, view_item,
      add_to_cart, begin_checkout, purchase and others. Use for funnels and
      counts of specific actions; use sessions.session_count for visits.
    ai_context:
      synonyms: [actions, hits, interactions]
    fields:
      - name: source_id
        expression: {sql: source_id}
        description: >
          GA4 property the row comes from: the label the deployment gives it,
          which may name the site (help_center) or not, one value for every row of
          a property. Group by it to answer per property or to compare them.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [property, GA4 property, site, website]
      - name: event_name
        expression: {sql: event_name}
        description: >
          What happened: page_view, view_item, add_to_cart, begin_checkout,
          add_payment_info, purchase, session_start and others.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [action, event type]
      - name: session_key
        expression: {sql: session_key}
        description: Session the event belongs to.
        datatype: String
      - name: event_date
        expression: {sql: event_date}
        description: Date of the event, in its GA4 property's time zone.
        datatype: Date
        dimension: {is_time: true}
        ai_context:
          synonyms: [date, day]
      - name: event_time
        expression: {sql: event_time}
        description: Time of the event, UTC.
        datatype: DateTimeTz
        dimension: {is_time: true}
      - name: page_location
        expression: {sql: page_location}
        description: Full URL of the page the event happened on.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [page, URL]
      - name: page_title
        expression: {sql: page_title}
        description: Title of the page the event happened on.
        datatype: String
        dimension: {is_time: false}
      - name: device_category
        expression: {sql: device_category}
        description: desktop, mobile or tablet.
        datatype: String
        dimension: {is_time: false}
        ai_context:
          synonyms: [device, device type]
      - name: country
        expression: {sql: country}
        description: Country of the visitor, from the IP address.
        datatype: String
        dimension: {is_time: false}
    metrics:
      - name: event_count
        expression: {sql: COUNT(*)}
        description: Number of recorded actions; filter by event_name for a specific one.
        datatype: Integer
        ai_context:
          synonyms: [events, actions]

relationships:
  - name: purchases_to_sessions
    from: purchases
    to: sessions
    from_columns: [source_id, session_key]
    to_columns: [source_id, session_key]
    ai_context:
      synonyms: [purchases by traffic source, revenue by channel]
  - name: events_to_sessions
    from: events
    to: sessions
    from_columns: [source_id, session_key]
    to_columns: [source_id, session_key]
