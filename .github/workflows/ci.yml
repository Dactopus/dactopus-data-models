name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ga4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: GA4 package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (ga4_raw, dactopus): nothing may
      # assume a database name. The input database is ga4_input.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/ga4 --profiles-dir sources/ga4
        --vars {"ga4_input_database":"ga4_input"}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.7.0"
      # The GA4 sample needs a Google login, so CI runs on hand-written rows
      # (tests/ga4/fixture.sql) and checks the model's answers against numbers
      # derived from them by hand. The first build runs on an empty input, as
      # a deployment set up before its first load would.
      - name: Build (models, tests, unit tests) and check numbers
        run: |
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=ga4_input', s.encode())" "$1"; }
          load sources/ga4/input.sql
          $DBT_BUILD
          load tests/ga4/fixture.sql
          $DBT_BUILD                 # incremental into empty tables
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD --full-refresh
          python3 tests/ga4/check_numbers.py
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/web_analytics.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The fixture's events are from 2025: one event now, in the input
      # only, makes the source fresh. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age
      # dbt reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          curl -sf http://127.0.0.1:8123/ --data-binary "INSERT INTO ga4_input.events SELECT * REPLACE (toUnixTimestamp64Micro(now64(6)) AS event_timestamp) FROM ga4_input.events LIMIT 1"
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/ga4 "SELECT max(fromUnixTimestamp64Micro(event_timestamp)) FROM ga4_input.events"

  shopify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: Shopify package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (shopify_raw, dactopus): nothing
      # may assume a database name. The input database is shopify_input.
      # The fixture's numbers are in the shop's time zone, New York. No
      # lookback: a run rereads only what was loaded since the last one, so
      # the late loads below come in through the keys that pick them up.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/shopify --profiles-dir sources/shopify
        --vars {"shopify_input_database":"shopify_input","shopify_timezone":"America/New_York","shopify_lookback_days":0}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.7.0"
      # Hand-written rows (tests/shopify/fixture.sql) and the model's answers
      # over them, checked against numbers derived by hand; the first build
      # runs on an empty input. The fixture goes into a database of its own
      # and reaches the input in loads, each followed by an incremental
      # run: all but a few rows, then rows that only a trigger brings back
      # in. The lines of 1012, a guest's order, and of the gift card refund
      # 505 change orders that nothing else rereads; 1001's lines, its gift
      # card among them, come after 505's and after the refund 501 has moved
      # the refunds' load window past 505, and make 505 a refund of 0; 1008,
      # back-dated, renumbers its customer's 1007. 1004 comes first in its
      # version for customer 2; its latest version, moved to customer 1,
      # comes last, alone, and the earlier version is then deleted, as an
      # input that collapses old versions would: customer 2's orders must
      # still be renumbered. After the late loads, the incremental build
      # must match a full refresh of the same input row for row.
      - name: Build (models, tests, unit tests), check numbers, incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          # early <table> <rows held back>; late <table> <rows>, loaded now
          early() { q "INSERT INTO shopify_input.$1 SELECT * FROM shopify_fixture.$1 WHERE NOT ($2)"; }
          late() { q "INSERT INTO shopify_input.$1 SELECT * REPLACE (now64(6) AS loaded_at) FROM shopify_fixture.$1 WHERE $2"; }
          # tables <database>: a checksum of each table
          tables() { for t in orders order_lines refunds sales_events; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/shopify/input.sql shopify_input
          load sources/shopify/input.sql shopify_fixture
          load tests/shopify/fixture.sql shopify_fixture
          $DBT_BUILD
          early orders "id = 1008 OR id = 1004 AND updated_at = '2026-10-03 15:00:00'"
          early order_lines "order_id IN (1001, 1008, 1012) OR order_id = 1004 AND order_updated_at = '2026-10-03 15:00:00'"
          early refunds "id = 501"
          early refund_lines "refund_id IN (501, 505)"
          $DBT_BUILD                 # incremental into empty tables
          late order_lines "order_id = 1012"
          late refund_lines "refund_id = 505"
          $DBT_BUILD                 # lines of orders loaded before
          same
          late refunds "id = 501"
          late refund_lines "refund_id = 501"
          $DBT_BUILD                 # a later refund
          late orders "id = 1008"
          late order_lines "order_id IN (1001, 1008)"
          $DBT_BUILD                 # a back-dated order, a gift card line after its refund
          late orders "id = 1004 AND updated_at = '2026-10-03 15:00:00'"
          late order_lines "order_id = 1004 AND order_updated_at = '2026-10-03 15:00:00'"
          q "DELETE FROM shopify_input.orders WHERE id = 1004 AND updated_at < '2026-10-03 15:00:00'"
          q "DELETE FROM shopify_input.order_lines WHERE order_id = 1004 AND order_updated_at < '2026-10-03 15:00:00'"
          $DBT_BUILD                 # an order moved to another customer
          python3 tests/shopify/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          python3 tests/shopify/check_numbers.py
          same
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full python3 tests/shopify/check_numbers.py
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/commerce.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The late rows above were loaded now. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age dbt
      # reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/shopify "SELECT max(loaded_at) FROM shopify_input.orders"

  woocommerce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: WooCommerce package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (woocommerce_raw, dactopus) and a
      # table prefix other than wp_: nothing may assume either. The input
      # database is woocommerce_input. The fixture's numbers are in the
      # store's time zone, New York. No lookback: a run rereads only what
      # was synced since the last one, so the late rows below come in
      # through the keys that pick them up.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/woocommerce --profiles-dir sources/woocommerce
        --vars {"woocommerce_input_database":"woocommerce_input","woocommerce_table_prefix":"wp_2_","woocommerce_timezone":"America/New_York","woocommerce_currency":"USD","woocommerce_lookback_days":0}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
      # Checks that warn in a deployment fail here.
      DACTOPUS_STRICT_TESTS: error
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.7.0"
      # Hand-written CDC rows (tests/woocommerce/fixture.sql); the first
      # build runs on an empty input. The fixture goes into a database of
      # its own and reaches the input in syncs, each followed by an
      # incremental run that must match a full refresh of the same input
      # row for row: first all but the later changes of a few orders, with
      # 109 placed for customer 2; then 109 moved to customer 1, its earlier
      # version deleted, as an input that collapses old versions would:
      # customer 2's 110 and 113, which nothing else rereads, must still be
      # renumbered; then
      # 107 cancelled (renumbering its customer's 110 and 113) and refunded
      # in part (refund 904, which leaves the reports with it), 113 paid on
      # delivery (its date moves) and refund 901 of 104, already built;
      # then 109's line removed, 114 moved to the trash and 116 deleted,
      # which delete+insert alone would leave in place; then product 14
      # deleted from the catalogue, which changes the SKU of 103's line and
      # no row of the order. Last, the same rows in the input's other form,
      # Nullable columns with NULL for empty values (PEERDB_NULLABLE), must
      # build the same tables.
      - name: Build (models, tests, unit tests), check numbers, incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { sed 's/wp_/wp_2_/g' "$1" | python3 -c "
          import sys, urllib.request
          for s in sys.stdin.read().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[1], s.encode())" "$2"; }
          # early <table> <rows held back>; late <table> <rows>, synced now
          early() { q "INSERT INTO woocommerce_input.wp_2_$1 SELECT * FROM woocommerce_fixture.wp_2_$1 WHERE NOT ($2)"; }
          late() { q "INSERT INTO woocommerce_input.wp_2_$1 SELECT * REPLACE (now64(9) AS _peerdb_synced_at) FROM woocommerce_fixture.wp_2_$1 WHERE $2"; }
          # tables <database> [columns]: a checksum of each table
          # sales_events has no sync time of its own: all its columns count.
          tables() { for t in orders order_lines refunds sales_events; do
              c=${2:-*}; [ $t = sales_events ] && c='*'
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple($c)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/woocommerce/input.sql woocommerce_input
          load sources/woocommerce/input.sql woocommerce_fixture
          load tests/woocommerce/fixture.sql woocommerce_fixture
          $DBT_BUILD
          v() { echo "_peerdb_version $1"; }
          early wc_orders "$(v 'IN (163, 116, 128, 151, 293, 207, 209, 306, 330, 360, 372)')"
          # 109 first for customer 2, on hold (numbered, unlike pending), in a
          # version before any of the fixture's (filtered inside: a replaced
          # column would shadow it in WHERE)
          q "INSERT INTO woocommerce_input.wp_2_wc_orders SELECT * REPLACE ('wc-on-hold' AS status, 2 AS customer_id, 0 AS _peerdb_version)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE $(v '= 163'))"
          early wc_order_operational_data "$(v 'IN (117, 294, 208, 210, 331, 361)')"
          early woocommerce_order_items "$(v 'IN (118, 198, 332, 362)')"
          early woocommerce_order_itemmeta "$(v 'BETWEEN 119 AND 127') OR $(v 'BETWEEN 199 AND 206') OR $(v 'BETWEEN 333 AND 340') OR $(v 'BETWEEN 363 AND 371')"
          early wc_order_addresses false
          early wc_orders_meta false
          early wc_product_meta_lookup "$(v '= 359')"
          $DBT_BUILD                 # incremental into empty tables
          same
          late wc_orders "$(v '= 163')"
          q "DELETE FROM woocommerce_input.wp_2_wc_orders WHERE id = 109 AND $(v '= 0')"
          $DBT_BUILD                 # an order moved to another customer
          same
          late wc_orders "$(v 'IN (116, 128, 151, 293, 360, 372)')"
          late wc_order_operational_data "$(v 'IN (117, 294, 361)')"
          late woocommerce_order_items "$(v 'IN (118, 362)')"
          late woocommerce_order_itemmeta "$(v 'BETWEEN 119 AND 127') OR $(v 'BETWEEN 363 AND 371')"
          $DBT_BUILD                 # a cancel, a payment on delivery, a refund
          same
          late wc_orders "$(v 'IN (207, 209, 306, 330)')"
          late wc_order_operational_data "$(v 'IN (208, 210, 331)')"
          late woocommerce_order_items "$(v 'IN (198, 332)')"
          late woocommerce_order_itemmeta "$(v 'BETWEEN 199 AND 206') OR $(v 'BETWEEN 333 AND 340')"
          $DBT_BUILD                 # a line removed, an order trashed, one deleted
          same
          late wc_product_meta_lookup "$(v '= 359')"
          $DBT_BUILD                 # a product deleted
          same
          test "$(q "SELECT count() FROM analytics.order_lines WHERE order_id = 103 AND sku IS NULL")" = 1
          $DBT_BUILD                 # incremental over unchanged input
          same
          # refunds keeps where its next window starts in its table's
          # comment (woocommerce_reading), not in its rows: the latest sync
          # it read, in UTC on a server that is not.
          test "$(q "SELECT comment FROM system.tables WHERE database = 'analytics' AND name = 'refunds'")" = \
               "read through $(q "SELECT toString(toTimeZone(max(_peerdb_synced_at), 'UTC')) FROM woocommerce_input.wp_2_wc_orders") UTC"
          python3 tests/woocommerce/check_numbers.py
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full python3 tests/woocommerce/check_numbers.py
          # Nullable columns but the keys and CDC's own; empty times, the
          # refunds' customer and the channel of refunds as NULL.
          sed -E '/^ +(id|order_id|order_item_id|meta_id|product_id|_peerdb_[a-z_]+) /!s/^( +[a-z_]+) (String|Decimal\(26, 8\)|DateTime64\(6\)|UInt64|Bool|Int64)/\1 Nullable(\2)/' \
              sources/woocommerce/input.sql > input_nullable.sql
          load input_nullable.sql woocommerce_nullable
          e="toDateTime64(0, 6)"
          q "INSERT INTO woocommerce_nullable.wp_2_wc_orders SELECT * REPLACE (if(type = 'shop_order_refund', NULL, customer_id) AS customer_id) FROM woocommerce_fixture.wp_2_wc_orders"
          q "INSERT INTO woocommerce_nullable.wp_2_wc_order_operational_data SELECT * REPLACE (nullIf(date_paid_gmt, $e) AS date_paid_gmt, nullIf(date_completed_gmt, $e) AS date_completed_gmt, nullIf(created_via, '') AS created_via) FROM woocommerce_fixture.wp_2_wc_order_operational_data"
          for t in wc_order_addresses wc_orders_meta woocommerce_order_items woocommerce_order_itemmeta wc_product_meta_lookup; do
              q "INSERT INTO woocommerce_nullable.wp_2_$t SELECT * FROM woocommerce_fixture.wp_2_$t"; done
          CLICKHOUSE_DATABASE=analytics_nullable ${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_nullable"'}
          # synced_at apart: the late rows above were synced later.
          tables analytics_nullable "* EXCEPT synced_at" > nullable.tsv
          tables analytics_full "* EXCEPT synced_at" > full.tsv
          diff nullable.tsv full.tsv
          # A store whose reports count cancelled orders: 107, paid, cancelled
          # and refunded 22 of 44, is a sale, and its net_total is what its
          # events add up to (sales_events_make_net_total): 22, not 0.
          CLICKHOUSE_DATABASE=analytics_cancelled ${DBT_BUILD/'"woocommerce_lookback_days":0'/'"woocommerce_lookback_days":0,"woocommerce_excluded_statuses":["pending","failed"]'}
          test "$(q "SELECT in_sales_reports AND net_total = 22 FROM analytics_cancelled.orders WHERE order_id = 107")" = 1
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/commerce.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The late rows above were synced now. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age dbt
      # reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/woocommerce "SELECT max(_peerdb_synced_at) FROM woocommerce_input.wp_2_wc_orders"
