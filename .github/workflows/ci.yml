name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run on its previous push. Each
# run on main has a group of its own, so none waits or is cancelled: in a
# shared group a waiting run is cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which jobs the changed files reach. A job runs when a file it reads
  # changed: its package, its entity, its tests and the module they share
  # (tests/ask_model.py), or what every job reads (common). Documentation
  # reaches none. The unions job builds every package, so every package
  # reaches it. A pull request is compared with its base branch, a push to
  # main with the commit before it. A change of text alone (a release's
  # version line, a model's descriptions) reaches no package or union
  # job: tests/reach.py reads what changed in the files the filters match.
  # The runner image is pinned, as the ClickHouse releases are: ubuntu-latest
  # moves to the next Ubuntu on GitHub's day, not ours. Dependabot does not
  # bump it; move every job when the pinned image nears its end of life.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validate: ${{ steps.reach.outputs.validate }}
      ga4: ${{ steps.reach.outputs.ga4 }}
      shopify: ${{ steps.reach.outputs.shopify }}
      woocommerce: ${{ steps.reach.outputs.woocommerce }}
      sensor_community: ${{ steps.reach.outputs.sensor_community }}
      unions: ${{ steps.reach.outputs.unions }}
    steps:
      # The whole history (a few MB), so the commit before a push is there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file matching a pattern and no negated one counts: a
          # package's README.md is documentation.
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            common: &common
              - .github/workflows/ci.yml
              - tests/reach.py
              - tests/profiles.yml
              - tests/check_contracts.py
              - tests/check_deployment.py
              - tests/check_freshness.py
            validate:
              - *common
              - entities/**
            ga4:
              - *common
              - sources/ga4/**
              - '!sources/ga4/README.md'
              - entities/web_analytics.yaml
              - tests/ga4/**
              - tests/ask_model.py
            shopify:
              - *common
              - sources/shopify/**
              - '!sources/shopify/README.md'
              - entities/commerce.yaml
              - tests/shopify/**
              - tests/commerce/**
              - tests/ask_model.py
              - tests/canon.py
              - tests/export_canon.py
              - tests/run_canon.py
            woocommerce:
              - *common
              - sources/woocommerce/**
              - '!sources/woocommerce/README.md'
              - entities/commerce.yaml
              - tests/woocommerce/**
              - tests/commerce/**
              - tests/ask_model.py
              - tests/canon.py
              - tests/export_canon.py
              - tests/run_canon.py
            sensor_community:
              - *common
              - sources/sensor_community/**
              - '!sources/sensor_community/README.md'
              - entities/iot.yaml
              - tests/sensor_community/**
              - tests/ask_model.py
            unions:
              - *common
              - unions/**
              - entities/**
              - sources/**
              - '!sources/*/README.md'
              - tests/*/fixture.sql
              - tests/check_union.py
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      # A pull request runs on its merge into the base branch: the merge's
      # first parent is the base as it is now.
      - name: Leave out changes of text alone
        id: reach
        env:
          FILTERS: ${{ toJSON(steps.filter.outputs) }}
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: uv run tests/reach.py "$BASE" HEAD | tee -a "$GITHUB_OUTPUT"
  # A deployment with several packages serves their models as one, and
  # the executor refuses a name defined in two files. No server needed.
  validate:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    name: Validate every Ossie model together
    steps:
      - uses: actions/checkout@v7
      # setup-uv keys its cache (the dbt and executor downloads) by a hash of
      # the dependency files; this repository has none, so the key is this
      # file, where the executor's version is pinned. Without it the key is
      # constant and the cache is never refreshed.
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      - name: Validate
        run: dactopus-ossie-clickhouse validate entities/*.yaml
  ga4:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.ga4 == 'true'
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: GA4 package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (ga4_raw, dactopus): nothing may
      # assume a database name. The input database is ga4_input.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/ga4 --profiles-dir tests
        --vars {"ga4_input_database":"ga4_input","ga4_source_id":"property_a"}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      # The GA4 sample needs a Google login, so CI runs on hand-written rows
      # (tests/ga4/fixture.sql) and checks the model's answers against numbers
      # derived from them by hand. The first build runs on an empty input, as
      # a deployment set up before its first load would.
      - name: Build (models, tests, unit tests) and check numbers
        run: |
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=ga4_input', s.encode())" "$1"; }
          load sources/ga4/input.sql
          $DBT_BUILD
          load tests/ga4/fixture.sql
          $DBT_BUILD                 # incremental into empty tables
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD --full-refresh
          python3 tests/ga4/check_numbers.py
      # deployment.yml names what a deployment sets and reads; the check
      # holds it to the package and the built tables. GA4's days are the
      # property's and the package takes no zone, so the count against
      # UTC only prints.
      - name: Check deployment.yml
        run: uv run tests/check_deployment.py sources/ga4 --time-zone UTC
      # Every model's columns and types are its contract; the columns the
      # Ossie models read have one type in every package, so the tables of
      # two packages add up (tests/check_contracts.py). The built tables
      # and views must match their contracts column by column, in order.
      - name: Check column contracts and the built tables
        run: uv run tests/check_contracts.py --built sources/ga4
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/web_analytics.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The fixture's events are from 2025: one event now, in the input
      # only, makes the source fresh. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age
      # dbt reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          curl -sf http://127.0.0.1:8123/ --data-binary "INSERT INTO ga4_input.events SELECT * REPLACE (toUnixTimestamp64Micro(now64(6)) AS event_timestamp) FROM ga4_input.events LIMIT 1"
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/ga4 "SELECT max(fromUnixTimestamp64Micro(event_timestamp)) FROM ga4_input.events"

      # Every row carries the label the build was given (ga4_source_id).
      # CI's builds give one other than the package's default, and the
      # one-label tests hold every table to it. A label the package does not
      # accept stops the build; a new label over tables built under the old
      # one fails those tests, with a message that names --full-refresh.
      - name: Label of the property
        run: |
          if ${DBT_BUILD/property_a/Property-a} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'ga4_source_id must be 1 to 64 characters' label.txt
          # No lookback: the run rebuilds the fixture's last day only, and its
          # first keeps the old label. With the default 3 days it would
          # relabel both, and the table would hold one label again.
          if ${DBT_BUILD/'"ga4_source_id":"property_a"'/'"ga4_source_id":"property_b","ga4_lookback_days":0'} > label.txt 2>&1
          then cat label.txt; exit 1; fi
          grep -q 'run dbt build --full-refresh once after changing ga4_source_id' label.txt
  shopify:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.shopify == 'true'
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: Shopify package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (shopify_raw, dactopus): nothing
      # may assume a database name. The input database is shopify_input.
      # The fixture's numbers are in the shop's time zone, New York. No
      # lookback: a run rereads only what was loaded since the last one, so
      # the late loads below come in through the keys that pick them up.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/shopify --profiles-dir tests
        --vars {"shopify_input_database":"shopify_input","shopify_timezone":"America/New_York","shopify_lookback_days":0,"shopify_source_id":"store_ny"}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
      # The model is served in the zone the package was built in
      # (docs/deployment.md); the checks and validate run in it.
      OSSIE_CLICKHOUSE_TIME_ZONE: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      # Hand-written rows (tests/shopify/fixture.sql) and the model's answers
      # over them, checked against numbers derived by hand; the first build
      # runs on an empty input. The fixture goes into a database of its own
      # and reaches the input in loads, each followed by an incremental
      # run: all but a few rows, then rows that only a trigger brings back
      # in. The lines of 1012, a guest's order, and of the gift card refund
      # 505 change orders that nothing else rereads; 1001's lines, its gift
      # card among them, come after 505's and after the refund 501 has moved
      # the refunds' load window past 505, and make 505 a refund of 0; 1008,
      # back-dated, renumbers its customer's 1007, and brings in its refund
      # 507, loaded before the order and left out until it came. The refund
      # 503, delivered again alone, brings back 1006 and no other order of
      # customer 2; its number must still count them; the Blanket's old
      # version comes with it, after the Blanket's deletion is built, and
      # must not bring the product back. 1004 comes first in its version for
      # customer 2; its latest version, moved to customer 1, comes last,
      # alone, and the earlier version is then deleted, as an input that
      # collapses old versions would: customer 2's orders must still be
      # renumbered. After the late loads, and after 503's, the incremental
      # build must match a full refresh of the same input row for row.
      - name: Build (models, tests, unit tests), check numbers, incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          # early <table> <rows held back>; late <table> <rows>, loaded now
          early() { q "INSERT INTO shopify_input.$1 SELECT * FROM shopify_fixture.$1 WHERE NOT ($2)"; }
          late() { q "INSERT INTO shopify_input.$1 SELECT * REPLACE (now64(6) AS loaded_at) FROM shopify_fixture.$1 WHERE $2"; }
          # tables <database>: a checksum of each table
          tables() { for t in orders order_lines refunds sales_events products product_categories_all product_brands_all \
                  product_categories product_brands line_categories line_brands customers; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/shopify/input.sql shopify_input
          load sources/shopify/input.sql shopify_fixture
          load tests/shopify/fixture.sql shopify_fixture
          $DBT_BUILD
          early orders "id = 1008 OR id = 1004 AND updated_at = '2026-10-03 15:00:00'"
          early order_lines "order_id IN (1001, 1008, 1012) OR order_id = 1004 AND order_updated_at = '2026-10-03 15:00:00'"
          early refunds "id = 501"
          early refund_lines "refund_id IN (501, 505)"
          early products "id = 107 AND loaded_at = '2026-10-04 06:00:04'"
          $DBT_BUILD                 # incremental into empty tables
          late order_lines "order_id = 1012"
          late refund_lines "refund_id = 505"
          $DBT_BUILD                 # lines of orders loaded before
          same
          late refunds "id = 501"
          late refund_lines "refund_id = 501"
          $DBT_BUILD                 # a later refund
          late orders "id = 1008"
          late order_lines "order_id IN (1001, 1008)"
          $DBT_BUILD                 # a back-dated order, a gift card line after its refund
          late refunds "id = 503"
          late refund_lines "refund_id = 503"
          late products "id = 107 AND loaded_at = '2026-10-04 06:00:04'"
          $DBT_BUILD                 # a refund delivered again, alone; a deleted product's old version
          same
          late orders "id = 1004 AND updated_at = '2026-10-03 15:00:00'"
          late order_lines "order_id = 1004 AND order_updated_at = '2026-10-03 15:00:00'"
          q "DELETE FROM shopify_input.orders WHERE id = 1004 AND updated_at < '2026-10-03 15:00:00'"
          q "DELETE FROM shopify_input.order_lines WHERE order_id = 1004 AND order_updated_at < '2026-10-03 15:00:00'"
          $DBT_BUILD                 # an order moved to another customer
          uv run tests/shopify/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          uv run tests/shopify/check_numbers.py
          same
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full uv run tests/shopify/check_numbers.py
      # The retention windows close by the last load of orders
      # (customers.sql), which the late loads above set to now. Over the
      # fixture and the windows' first orders a year back
      # (tests/shopify/windows.sql), loaded at once, the last load is
      # theirs and the windows' numbers hold.
      - name: Check retention windows
        run: |
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          load sources/shopify/input.sql shopify_windows
          load tests/shopify/fixture.sql shopify_windows
          load tests/shopify/windows.sql shopify_windows
          CLICKHOUSE_DATABASE=analytics_windows ${DBT_BUILD/'"shopify_input"'/'"shopify_windows"'}
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_windows uv run tests/shopify/check_numbers.py --windows
      # The canonical tables: the columns the model reads, as the package
      # builds them over the fixture loaded at once, the database
      # shopify_fixture the late loads above read from (the windows' columns
      # depend on the last load, which the late loads above set to now, so
      # the files cannot come from that build) and over the fixture with
      # windows.sql. They must be the files in the repository
      # (tests/shopify/canon, canon_windows, tests/commerce/tables.sql):
      # a change that moves a canonical row changes them in the same pull
      # request. The model is then asked its questions over the files
      # alone, loaded into new databases with no dbt: tests/run_canon.py.
      - name: Check the canonical tables
        run: |
          CLICKHOUSE_DATABASE=analytics_canon ${DBT_BUILD/'"shopify_input"'/'"shopify_fixture"'}
          CLICKHOUSE_DATABASE=analytics_canon uv run tests/export_canon.py shopify --check
          CLICKHOUSE_DATABASE=analytics_windows uv run tests/export_canon.py shopify --windows --check
          uv run tests/run_canon.py shopify --engine clickhouse --database analytics_canon_files
          uv run tests/run_canon.py shopify --windows --engine clickhouse --database analytics_canon_files_windows
      # deployment.yml names what a deployment sets and reads; the check
      # holds it to the package and the built tables, and counts the rows
      # whose date is not the day of their time in the build's zone: none
      # after builds in one zone. A run in another zone without
      # --full-refresh stops (shopify_check_settings) and leaves the
      # tables as New York built them, so the check, which the run did
      # not change, finds 1003, at 02:00 UTC, on New York's day and fails
      # on orders, not for another reason. A full refresh in UTC builds
      # them whole, and the check passes.
      - name: Check deployment.yml, in one zone and in two
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          uv run tests/check_deployment.py sources/shopify --time-zone America/New_York
          CLICKHOUSE_DATABASE=analytics_full uv run tests/check_deployment.py sources/shopify --time-zone America/New_York
          q "CREATE DATABASE shopify_zones"
          for t in orders order_lines refunds refund_lines products; do
              q "CREATE TABLE shopify_zones.$t AS shopify_fixture.$t"
              q "INSERT INTO shopify_zones.$t SELECT * FROM shopify_fixture.$t"
          done
          ZONES=${DBT_BUILD/'"shopify_input"'/'"shopify_zones"'}
          CLICKHOUSE_DATABASE=analytics_zones $ZONES --full-refresh
          if CLICKHOUSE_DATABASE=analytics_zones ${ZONES/America\/New_York/UTC} > zones.txt 2>&1; then cat zones.txt; exit 1; fi
          grep -q 'shopify_timezone was "America/New_York", is "UTC"' zones.txt
          if CLICKHOUSE_DATABASE=analytics_zones uv run tests/check_deployment.py sources/shopify --time-zone UTC > zones.txt; then cat zones.txt; exit 1; fi
          cat zones.txt
          grep -q '^FAIL orders was not built in UTC' zones.txt
          CLICKHOUSE_DATABASE=analytics_zones ${ZONES/America\/New_York/UTC} --full-refresh
          CLICKHOUSE_DATABASE=analytics_zones uv run tests/check_deployment.py sources/shopify --time-zone UTC
      - name: Check column contracts and the built tables
        run: uv run tests/check_contracts.py --built sources/shopify
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/commerce.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The late rows above were loaded now. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age dbt
      # reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/shopify "SELECT max(loaded_at) FROM shopify_input.orders"

      # Every row carries the label the build was given (shopify_source_id).
      # CI's builds give one other than the package's default, and the
      # one-label tests hold every table to it. A label the package does not
      # accept stops the build; a new label over tables built under the old
      # one stops the run before it reads or deletes a row of orders,
      # order_lines or refunds (shopify_check_settings), with a message
      # that names the variable and --full-refresh. The one-label tests
      # are the second line: they hold every table, also the ones the
      # run builds whole.
      - name: Label of the store
        run: |
          if ${DBT_BUILD/store_ny/Store-ny} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'shopify_source_id must be 1 to 64 characters' label.txt
          if ${DBT_BUILD/store_ny/store_la} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'shopify_source_id was "store_ny", is "store_la"' label.txt
          grep -q 'run dbt build --full-refresh once' label.txt

      # The variables the built rows depend on (shopify_settings) are
      # recorded in the comment of orders, order_lines and refunds. A run
      # that changes one stops before it reads or deletes a row of these
      # tables, and names it, so their rows stay as they were (the sums
      # below); a full refresh records the new value and the next run
      # goes on.
      - name: Settings the built rows depend on
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          run() { CLICKHOUSE_DATABASE=analytics_settings "$@"; }
          # with_vars <variable>=<JSON value>...: the build command with these variables set
          with_vars() { python3 - "$DBT_BUILD" "$@" <<'EOF'
          import json, sys
          words = sys.argv[1].split()
          values = json.loads(words[-1])
          for pair in sys.argv[2:]:
              name, value = pair.split("=", 1)
              values[name] = json.loads(value)
          print(" ".join(words[:-1] + [json.dumps(values, separators=(",", ":"))]))
          EOF
          }
          # stops <variable> <JSON value>: the run stops, naming the variable and no other
          stops() {
              if run $(with_vars "$1=$2") > settings.txt 2>&1; then cat settings.txt; exit 1; fi
              grep -q "($1 was [^;]*): run dbt build --full-refresh once" settings.txt
          }
          sums() { for t in orders order_lines refunds; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM analytics_settings.$t FORMAT TSV"; done; }
          run $DBT_BUILD
          run $DBT_BUILD                 # unchanged settings
          sums > before.txt
          stops shopify_timezone '"UTC"'
          stops shopify_source_id '"store_la"'
          sums > after.txt
          diff before.txt after.txt
          CHANGED=$(with_vars shopify_timezone='"UTC"' shopify_source_id='"store_la"')
          run $CHANGED --full-refresh
          run $CHANGED
          if run $DBT_BUILD > settings.txt 2>&1; then cat settings.txt; exit 1; fi
          grep -q 'shopify_timezone was "UTC", is "America/New_York"' settings.txt
  woocommerce:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.woocommerce == 'true'
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
        # The oldest ClickHouse the package supports and the one it is
        # tested on. Its materialized CTEs (woocommerce_query_settings)
        # fail on 26.3 to 26.6 with errors of ClickHouse's own.
        clickhouse: ["26.7", "26.9"]
    name: WooCommerce package (dbt ${{ matrix.dbt.name }}, ClickHouse ${{ matrix.clickhouse }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (woocommerce_raw, dactopus) and a
      # table prefix other than wp_: nothing may assume either. The input
      # database is woocommerce_input. The fixture's numbers are in the
      # store's time zone, New York. No lookback: a run rereads only what
      # was synced since the last one, so the late rows below come in
      # through the keys that pick them up.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/woocommerce --profiles-dir tests
        --vars {"woocommerce_input_database":"woocommerce_input","woocommerce_table_prefix":"wp_2_","woocommerce_timezone":"America/New_York","woocommerce_currency":"USD","woocommerce_lookback_days":0,"woocommerce_source_id":"store_wc"}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
      # The model is served in the zone the package was built in
      # (docs/deployment.md); the checks and validate run in it.
      OSSIE_CLICKHOUSE_TIME_ZONE: America/New_York
      # Checks that warn in a deployment fail here.
      DACTOPUS_STRICT_TESTS: error
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      # Hand-written CDC rows (tests/woocommerce/fixture.sql); the first
      # build runs on an empty input. The fixture goes into a database of
      # its own and reaches the input in syncs, each followed by an
      # incremental run that must match a full refresh of the same input
      # row for row: first all but the later changes of a few orders, with
      # 109 placed for customer 2 and 114 for customer 1, and without
      # customer 2's orders, guest4's 112 and 117, so that guest 102, billed
      # to customer 2's email in other case, and guest4's 118 are customers
      # of their own; then customer 2's orders and a version of 117 billed
      # to that email too, and 102 joins customer 1, the smaller account;
      # then 117's own version, and 102 moves to customer 2, whose orders,
      # which nothing else rereads, must be renumbered; then 112, and 118
      # takes guest4's number from it, the smaller id; then 109 moved to
      # customer 1, its earlier version deleted, as an input that collapses
      # old versions would: customer 2's 110 and 113, which nothing else
      # rereads, must still be renumbered; then
      # 107 cancelled (renumbering its customer's 110 and 113) and refunded
      # in part (refund 904, which leaves the reports with it), 113 paid on
      # delivery (its date moves) and refund 901 of 104, already built;
      # then 109's line removed and 116 deleted, which delete+insert alone
      # would leave in place; then product 14 deleted from the catalogue,
      # which changes the SKU of 103's line and no row of the order,
      # product 13 moved to the trash, which leaves the catalog while its
      # sales keep their category, and a version of guest 112 delivered
      # again, so that the next window holds
      # no order of customer 1; then 114 moved to a guest and to the trash
      # in one window, its version for customer 1 deleted: neither the
      # input nor the order's row, which goes, names customer 1, whose 117
      # must still be renumbered (#17), also when the first run of that
      # window fails after deleting the row. Last, the same rows in the
      # input's other form, Nullable columns with NULL for empty values
      # (PEERDB_NULLABLE), must build the same tables.
      - name: Build (models, tests, unit tests), check numbers, incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { sed 's/wp_/wp_2_/g' "$1" | python3 -c "
          import sys, urllib.request
          for s in sys.stdin.read().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[1], s.encode())" "$2"; }
          # early <table> <rows held back>; late <table> <rows>, synced now
          early() { q "INSERT INTO woocommerce_input.wp_2_$1 SELECT * FROM woocommerce_fixture.wp_2_$1 WHERE NOT ($2)"; }
          late() { q "INSERT INTO woocommerce_input.wp_2_$1 SELECT * REPLACE (now64(9) AS _peerdb_synced_at) FROM woocommerce_fixture.wp_2_$1 WHERE $2"; }
          # tables <database> [columns] [customer columns]: a checksum of
          # each table. Only orders, order_lines and refunds keep a sync
          # time, and customers' retention windows close by the last one:
          # all the other tables' columns count.
          tables() { for t in orders order_lines refunds sales_events products product_categories_all product_brands_all \
                  product_categories product_brands line_categories line_brands customers; do
              case $t in orders|order_lines|refunds) c=${2:-*} ;; customers) c=${3:-*} ;; *) c='*' ;; esac
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple($c)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/woocommerce/input.sql woocommerce_input
          load sources/woocommerce/input.sql woocommerce_fixture
          load tests/woocommerce/fixture.sql woocommerce_fixture
          $DBT_BUILD
          v() { echo "_peerdb_version $1"; }
          early wc_orders "$(v 'IN (163, 116, 128, 151, 293, 207, 209, 295, 306, 330, 360, 372, 75, 91, 140, 211, 277, 261, 273, 275, 341)')"
          # 109 first for customer 2, on hold (numbered, unlike pending), and
          # 114 first for customer 1, in versions before any of the
          # fixture's (filtered inside: a replaced column would shadow it in
          # WHERE)
          q "INSERT INTO woocommerce_input.wp_2_wc_orders SELECT * REPLACE ('wc-on-hold' AS status, 2 AS customer_id, 0 AS _peerdb_version)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE $(v '= 163'))"
          q "INSERT INTO woocommerce_input.wp_2_wc_orders SELECT * REPLACE (1 AS customer_id, 0 AS _peerdb_version)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE $(v '= 295'))"
          early wc_order_operational_data "$(v 'IN (117, 294, 208, 210, 331, 361)')"
          early woocommerce_order_items "$(v 'IN (118, 198, 332, 362)')"
          early woocommerce_order_itemmeta "$(v 'BETWEEN 119 AND 127') OR $(v 'BETWEEN 199 AND 206') OR $(v 'BETWEEN 333 AND 340') OR $(v 'BETWEEN 363 AND 371')"
          early wc_order_addresses false
          early wc_orders_meta false
          early wc_product_meta_lookup "$(v '= 359')"
          early posts "$(v '= 416')"
          early terms false
          early term_taxonomy false
          early term_relationships false
          $DBT_BUILD                 # incremental into empty tables
          # customer <order id>: the customer orders names for it
          customer() { q "SELECT customer_id FROM analytics.orders WHERE order_id = $1"; }
          test "$(customer 102)" = -102
          test "$(customer 118)" = -118
          same
          late wc_orders "$(v 'IN (75, 91, 140, 211, 277)')"
          q "INSERT INTO woocommerce_input.wp_2_wc_orders SELECT * REPLACE ('BOB@example.com' AS billing_email, now64(9) AS _peerdb_synced_at, 0 AS _peerdb_version)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE $(v '= 341'))"
          $DBT_BUILD                 # a guest joined to an account
          test "$(customer 102)" = 1
          same
          late wc_orders "$(v '= 341')"
          $DBT_BUILD                 # a guest moved to another account
          test "$(customer 102)" = 2
          same
          late wc_orders "$(v 'IN (261, 273, 275)')"
          $DBT_BUILD                 # a guest's order with a smaller id
          test "$(customer 118)" = -112
          same
          late wc_orders "$(v '= 163')"
          q "DELETE FROM woocommerce_input.wp_2_wc_orders WHERE id = 109 AND $(v '= 0')"
          $DBT_BUILD                 # an order moved to another customer
          same
          late wc_orders "$(v 'IN (116, 128, 151, 293, 360, 372)')"
          late wc_order_operational_data "$(v 'IN (117, 294, 361)')"
          late woocommerce_order_items "$(v 'IN (118, 362)')"
          late woocommerce_order_itemmeta "$(v 'BETWEEN 119 AND 127') OR $(v 'BETWEEN 363 AND 371')"
          $DBT_BUILD                 # a cancel, a payment on delivery, a refund
          same
          late wc_orders "$(v 'IN (207, 209, 330)')"
          late wc_order_operational_data "$(v 'IN (208, 210, 331)')"
          late woocommerce_order_items "$(v 'IN (198, 332)')"
          late woocommerce_order_itemmeta "$(v 'BETWEEN 199 AND 206') OR $(v 'BETWEEN 333 AND 340')"
          $DBT_BUILD                 # a line removed, an order deleted
          same
          late wc_product_meta_lookup "$(v '= 359')"
          late wc_orders "$(v '= 275')"
          late posts "$(v '= 416')"
          $DBT_BUILD                 # a product deleted, one trashed, a version delivered again
          same
          test "$(q "SELECT count() FROM analytics.order_lines WHERE order_id = 103 AND sku IS NULL")" = 1
          late wc_orders "$(v 'IN (295, 306)')"
          q "DELETE FROM woocommerce_input.wp_2_wc_orders WHERE id = 114 AND $(v '= 0')"
          # A run of orders that fails after its pre-hooks (an order in
          # another currency that no rate converts, woocommerce_amount),
          # leaving 114's row deleted: the next run must still find
          # customer 1 in orders__changed. The order is deleted again after.
          q "INSERT INTO woocommerce_input.wp_2_wc_orders SELECT * REPLACE (9901 AS id, 'JPY' AS currency, now64(9) AS _peerdb_synced_at)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE id = 101 AND status = 'wc-processing')"
          if $DBT_BUILD --select orders; then exit 1; fi
          q "DELETE FROM woocommerce_input.wp_2_wc_orders WHERE id = 9901"
          test "$(q "EXISTS TABLE analytics.orders__changed")" = 1
          $DBT_BUILD                 # an order moved to a guest and trashed
          test "$(q "EXISTS TABLE analytics.orders__changed")" = 0
          same
          $DBT_BUILD                 # incremental over unchanged input
          same
          # refunds keeps where its next window starts in its table's
          # comment (woocommerce_reading), not in its rows: the latest sync
          # it read, in UTC on a server that is not. The comment also holds
          # the settings the table was built with, after the position
          # (woocommerce_settings); orders has them alone.
          test "$(q "SELECT extract(comment, '^read through ([^;]+) UTC; built with ') FROM system.tables WHERE database = 'analytics' AND name = 'refunds'")" = \
               "$(q "SELECT toString(toTimeZone(max(_peerdb_synced_at), 'UTC')) FROM woocommerce_input.wp_2_wc_orders")"
          test "$(q "SELECT JSONExtractString(extract(comment, '^built with (.*)$'), 'woocommerce_timezone') FROM system.tables WHERE database = 'analytics' AND name = 'orders'")" = America/New_York
          uv run tests/woocommerce/check_numbers.py
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full uv run tests/woocommerce/check_numbers.py
          # Nullable columns but the keys and CDC's own; empty times, the
          # refunds' customer and the channel of refunds as NULL.
          sed -E '/^ +(id|order_id|order_item_id|meta_id|product_id|term_id|term_taxonomy_id|object_id|_peerdb_[a-z_]+) /!s/^( +[a-z_]+) (String|Decimal\(26, 8\)|DateTime64\(6\)|UInt64|Bool|Int64)/\1 Nullable(\2)/' \
              sources/woocommerce/input.sql > input_nullable.sql
          load input_nullable.sql woocommerce_nullable
          e="toDateTime64(0, 6)"
          q "INSERT INTO woocommerce_nullable.wp_2_wc_orders SELECT * REPLACE (if(type = 'shop_order_refund', NULL, customer_id) AS customer_id) FROM woocommerce_fixture.wp_2_wc_orders"
          q "INSERT INTO woocommerce_nullable.wp_2_wc_order_operational_data SELECT * REPLACE (nullIf(date_paid_gmt, $e) AS date_paid_gmt, nullIf(date_completed_gmt, $e) AS date_completed_gmt, nullIf(created_via, '') AS created_via) FROM woocommerce_fixture.wp_2_wc_order_operational_data"
          for t in wc_order_addresses wc_orders_meta woocommerce_order_items woocommerce_order_itemmeta wc_product_meta_lookup \
                  posts terms term_taxonomy term_relationships; do
              q "INSERT INTO woocommerce_nullable.wp_2_$t SELECT * FROM woocommerce_fixture.wp_2_$t"; done
          CLICKHOUSE_DATABASE=analytics_nullable ${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_nullable"'}
          # synced_at and the retention windows apart: the late rows above
          # were synced later.
          tables analytics_nullable "* EXCEPT synced_at" "* EXCEPT ('^second_order_within_')" > nullable.tsv
          tables analytics_full "* EXCEPT synced_at" "* EXCEPT ('^second_order_within_')" > full.tsv
          diff nullable.tsv full.tsv
          # A store whose reports count cancelled orders: 107, paid, cancelled
          # and refunded 22 of 44, is a sale, and its net_total is what its
          # events add up to (sales_events_make_net_total): 22, not 0.
          CLICKHOUSE_DATABASE=analytics_cancelled ${DBT_BUILD/'"woocommerce_lookback_days":0'/'"woocommerce_lookback_days":0,"woocommerce_excluded_statuses":["pending","failed"]'}
          test "$(q "SELECT in_sales_reports AND net_total = 22 FROM analytics_cancelled.orders WHERE order_id = 107")" = true
          # A table whose columns a release changed, here one type: the next
          # incremental run stops before its pre-hooks delete a row
          # (woocommerce_check_columns). dbt's own check comes after them,
          # and refunds would be left empty.
          q "ALTER TABLE analytics_cancelled.refunds MODIFY COLUMN refunded_quantity Int32"
          refunds=$(q "SELECT count() FROM analytics_cancelled.refunds")
          if CLICKHOUSE_DATABASE=analytics_cancelled ${DBT_BUILD/'"woocommerce_lookback_days":0'/'"woocommerce_lookback_days":0,"woocommerce_excluded_statuses":["pending","failed"]'} > columns.txt 2>&1
          then cat columns.txt; exit 1; fi
          grep -q 'has other columns than this release builds' columns.txt
          test "$(q "SELECT count() FROM analytics_cancelled.refunds")" = "$refunds"
          # An order in another currency that no plugin's rate converts fails
          # the build with woocommerce_amount's message; its amounts are
          # never 0.
          load sources/woocommerce/input.sql woocommerce_norate
          for t in wc_orders wc_order_operational_data wc_order_addresses wc_orders_meta woocommerce_order_items \
                  woocommerce_order_itemmeta wc_product_meta_lookup posts terms term_taxonomy term_relationships; do
              q "INSERT INTO woocommerce_norate.wp_2_$t SELECT * FROM woocommerce_fixture.wp_2_$t"; done
          q "INSERT INTO woocommerce_norate.wp_2_wc_orders SELECT * REPLACE (9901 AS id, 'JPY' AS currency)
             FROM (SELECT * FROM woocommerce_fixture.wp_2_wc_orders WHERE id = 101 AND status = 'wc-processing')"
          if CLICKHOUSE_DATABASE=analytics_norate ${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_norate"'} > norate.txt 2>&1
          then cat norate.txt; exit 1; fi
          grep -q 'An amount in another currency has no exchange rate the package knows' norate.txt
      # The retention windows close by the last sync of orders
      # (customers.sql), which the late rows above set to now. Over the
      # fixture and the windows' first orders a year back
      # (tests/woocommerce/windows.sql), synced at once, the last sync is
      # theirs and the windows' numbers hold.
      - name: Check retention windows
        run: |
          load() { sed 's/wp_/wp_2_/g' "$1" | python3 -c "
          import sys, urllib.request
          for s in sys.stdin.read().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[1], s.encode())" "$2"; }
          load sources/woocommerce/input.sql woocommerce_windows
          load tests/woocommerce/fixture.sql woocommerce_windows
          load tests/woocommerce/windows.sql woocommerce_windows
          CLICKHOUSE_DATABASE=analytics_windows ${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_windows"'}
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_windows uv run tests/woocommerce/check_numbers.py --windows
      # The canonical tables: the columns the model reads, as the package
      # builds them over the fixture synced at once, the database
      # woocommerce_fixture the late rows above read from (the windows' columns
      # depend on the last sync, which the late rows above set to now, so
      # the files cannot come from that build) and over the fixture with
      # windows.sql. They must be the files in the repository
      # (tests/woocommerce/canon, canon_windows, tests/commerce/tables.sql):
      # a change that moves a canonical row changes them in the same pull
      # request. The model is then asked its questions over the files
      # alone, loaded into new databases with no dbt: tests/run_canon.py.
      - name: Check the canonical tables
        run: |
          CLICKHOUSE_DATABASE=analytics_canon ${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_fixture"'}
          CLICKHOUSE_DATABASE=analytics_canon uv run tests/export_canon.py woocommerce --check
          CLICKHOUSE_DATABASE=analytics_windows uv run tests/export_canon.py woocommerce --windows --check
          uv run tests/run_canon.py woocommerce --engine clickhouse --database analytics_canon_files
          uv run tests/run_canon.py woocommerce --windows --engine clickhouse --database analytics_canon_files_windows
      # deployment.yml names what a deployment sets and reads; the check
      # holds it to the package and the built tables, and counts the rows
      # whose date is not the day of their time in the build's zone: none
      # after builds in one zone. A run in another zone without
      # --full-refresh stops (woocommerce_check_settings) and leaves the
      # tables as New York built them, so the check, which the run did
      # not change, finds 103, paid at 02:10 UTC, on New York's day and
      # fails on orders, not for another reason. A full refresh in UTC
      # builds them whole, and the check passes.
      - name: Check deployment.yml, in one zone and in two
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          uv run tests/check_deployment.py sources/woocommerce --time-zone America/New_York
          CLICKHOUSE_DATABASE=analytics_full uv run tests/check_deployment.py sources/woocommerce --time-zone America/New_York
          q "CREATE DATABASE woocommerce_zones"
          for t in wc_orders wc_order_operational_data wc_order_addresses wc_orders_meta woocommerce_order_items woocommerce_order_itemmeta wc_product_meta_lookup \
                  posts terms term_taxonomy term_relationships; do
              q "CREATE TABLE woocommerce_zones.wp_2_$t AS woocommerce_fixture.wp_2_$t"
              q "INSERT INTO woocommerce_zones.wp_2_$t SELECT * FROM woocommerce_fixture.wp_2_$t"
          done
          ZONES=${DBT_BUILD/'"woocommerce_input"'/'"woocommerce_zones"'}
          CLICKHOUSE_DATABASE=analytics_zones $ZONES --full-refresh
          if CLICKHOUSE_DATABASE=analytics_zones ${ZONES/America\/New_York/UTC} > zones.txt 2>&1; then cat zones.txt; exit 1; fi
          grep -q 'woocommerce_timezone was "America/New_York", is "UTC"' zones.txt
          if CLICKHOUSE_DATABASE=analytics_zones uv run tests/check_deployment.py sources/woocommerce --time-zone UTC > zones.txt; then cat zones.txt; exit 1; fi
          cat zones.txt
          grep -q '^FAIL orders was not built in UTC' zones.txt
          CLICKHOUSE_DATABASE=analytics_zones ${ZONES/America\/New_York/UTC} --full-refresh
          CLICKHOUSE_DATABASE=analytics_zones uv run tests/check_deployment.py sources/woocommerce --time-zone UTC
      - name: Check column contracts and the built tables
        run: uv run tests/check_contracts.py --built sources/woocommerce
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/commerce.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The late rows above were synced now. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age dbt
      # reports must match ClickHouse's own (tests/check_freshness.py).
      - name: Source freshness
        run: |
          ${DBT_BUILD/dbt build/dbt source freshness}
          python3 tests/check_freshness.py sources/woocommerce "SELECT max(_peerdb_synced_at) FROM woocommerce_input.wp_2_wc_orders"

      # Every row carries the label the build was given (woocommerce_source_id).
      # CI's builds give one other than the package's default, and the
      # one-label tests hold every table to it. A label the package does not
      # accept stops the build; a new label over tables built under the old
      # one stops the run before it reads or deletes a row of orders,
      # order_lines or refunds (woocommerce_check_settings), with a
      # message that names the variable and --full-refresh. The one-label
      # tests are the second line: they hold every table, also the ones
      # the run builds whole.
      - name: Label of the store
        run: |
          if ${DBT_BUILD/store_wc/Store-wc} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'woocommerce_source_id must be 1 to 64 characters' label.txt
          if ${DBT_BUILD/store_wc/store_eu} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'woocommerce_source_id was "store_wc", is "store_eu"' label.txt
          grep -q 'run dbt build --full-refresh once' label.txt

      # The variables the built rows depend on (woocommerce_settings) are
      # recorded in the comment of orders, order_lines and refunds. A run
      # that changes one stops before it reads or deletes a row of these
      # tables, and names it, so their rows stay as they were (the sums
      # below); a full refresh records the new values and the next run
      # goes on.
      # The currency is only stopped on: the fixture's orders are in USD,
      # and a store in EUR with no rate for them fails its build.
      - name: Settings the built rows depend on
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          run() { CLICKHOUSE_DATABASE=analytics_settings "$@"; }
          # with_vars <variable>=<JSON value>...: the build command with these variables set
          with_vars() { python3 - "$DBT_BUILD" "$@" <<'EOF'
          import json, sys
          words = sys.argv[1].split()
          values = json.loads(words[-1])
          for pair in sys.argv[2:]:
              name, value = pair.split("=", 1)
              values[name] = json.loads(value)
          print(" ".join(words[:-1] + [json.dumps(values, separators=(",", ":"))]))
          EOF
          }
          # stops <variable> <JSON value>: the run stops, naming the variable and no other
          stops() {
              if run $(with_vars "$1=$2") > settings.txt 2>&1; then cat settings.txt; exit 1; fi
              grep -q "($1 was [^;]*): run dbt build --full-refresh once" settings.txt
          }
          sums() { for t in orders order_lines refunds; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM analytics_settings.$t FORMAT TSV"; done; }
          run $DBT_BUILD
          run $DBT_BUILD                 # unchanged settings
          sums > before.txt
          stops woocommerce_timezone '"UTC"'
          stops woocommerce_currency '"EUR"'
          stops woocommerce_source_id '"store_eu"'
          stops woocommerce_date_type '"date_created"'
          stops woocommerce_excluded_statuses '["pending","cancelled","failed","on-hold"]'
          stops woocommerce_order_statuses '{"shipped":"completed"}'
          stops woocommerce_price_decimals 3
          stops woocommerce_order_number_meta_key '"_order_number"'
          sums > after.txt
          diff before.txt after.txt
          CHANGED=$(with_vars woocommerce_timezone='"UTC"' woocommerce_source_id='"store_eu"' woocommerce_date_type='"date_created"' \
              woocommerce_excluded_statuses='["pending","cancelled","failed","on-hold"]' woocommerce_order_statuses='{"shipped":"completed"}' \
              woocommerce_price_decimals=3 woocommerce_order_number_meta_key='"_order_number"')
          run $CHANGED --full-refresh
          run $CHANGED
          if run $DBT_BUILD > settings.txt 2>&1; then cat settings.txt; exit 1; fi
          grep -q 'woocommerce_timezone was "UTC", is "America/New_York"' settings.txt
  sensor_community:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.sensor_community == 'true'
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: Sensor.Community package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (sensor_community_raw, dactopus):
      # nothing may assume a database name. The input database is
      # sensor_community_input. No lookback: a run rereads only the
      # sensor-days loaded since the last one.
      CLICKHOUSE_DATABASE: analytics
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/sensor_community --profiles-dir tests
        --vars {"sensor_community_input_database":"sensor_community_input","sensor_community_lookback_days":0,"sensor_community_source_id":"network_a"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      # Hand-written rows (tests/sensor_community/fixture.sql) reach the input
      # in the loads they record, each followed by an incremental run; the
      # first build runs on an empty input. The higher of the two copies of
      # 12:16:34 (temperature 22.2) comes last, with site 101's day loaded
      # again and the snapshot delivered again: the run must reread the
      # sensor-days it loads whole and keep 22.1, which a run that weighs
      # only the new rows would replace. With them comes 1006's day again,
      # its 09:00 lower and without humidity: the run must replace the
      # whole sensor-day, or the first copy's humidity, a reading the kept
      # row does not have, would stay. After it, and after a run over
      # unchanged input, the incremental build must match a full refresh of
      # the same input row for row. Last, ClickHouse merges the snapshots,
      # one row left of each site and sensor, and the tables must not
      # change. Then the snapshot of October 19 12:30 arrives with no run
      # after it: devices is a view, and the model's answers must already
      # see it. The fixture's own snapshots are never merged: a merge there
      # would drop the earlier snapshot before it is loaded. The model's
      # numbers are checked from entities/iot.yaml
      # (tests/sensor_community/check_numbers.py).
      - name: Build (models, tests), incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          # early <table> <rows>, as the fixture loaded them; late <table> <rows>, loaded now
          early() { q "INSERT INTO sensor_community_input.$1 SELECT * FROM sensor_community_fixture.$1 WHERE $2"; }
          late() { q "INSERT INTO sensor_community_input.$1 SELECT * REPLACE (now64(6) AS loaded_at) FROM (SELECT * FROM sensor_community_fixture.$1 WHERE $2)"; }
          # tables <database>: a checksum of each table
          tables() { for t in devices_archive devices readings; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/sensor_community/input.sql sensor_community_input
          load sources/sensor_community/input.sql sensor_community_fixture
          q "SYSTEM STOP MERGES sensor_community_fixture.locations"
          load tests/sensor_community/fixture.sql sensor_community_fixture
          higher="sensor_id = 1003 AND timestamp = '2026-10-18 12:16:34' AND temperature = 22.2"
          $DBT_BUILD                 # empty input
          early locations "snapshot_at = '2026-10-18 10:00:00'"
          early readings "loaded_at = '2026-10-19 10:30:00' AND NOT ($higher)"
          $DBT_BUILD                 # October 18 into empty tables
          early locations "loaded_at = '2026-10-19 10:00:01'"
          early readings "loaded_at = '2026-10-20 10:30:00'"
          $DBT_BUILD                 # October 19
          same
          late readings "$higher"
          late readings "loaded_at = '2026-10-20 11:00:00'"
          late readings "loaded_at = '2026-10-20 11:30:00'"
          late locations "loaded_at = '2026-10-19 10:05:00'"
          $DBT_BUILD                 # copies of a time higher and lower, a day and a snapshot again
          same
          $DBT_BUILD                 # incremental over unchanged input
          same
          cp full.tsv unmerged.tsv
          q "OPTIMIZE TABLE sensor_community_input.locations FINAL"
          test "$(q 'SELECT count() FROM sensor_community_input.locations')" = 6
          $DBT_BUILD                 # the snapshots merged
          same
          diff unmerged.tsv full.tsv
          late locations "snapshot_at = '2026-10-19 12:30:00'"   # no run after it
          python3 tests/sensor_community/check_numbers.py
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full python3 tests/sensor_community/check_numbers.py
      # deployment.yml names what a deployment sets and reads; the check
      # holds it to the package and the built tables. The file declares
      # zone: UTC, the zone reading_date is in by the model, not by a
      # variable: the check counts in it, with no option, and fails on a
      # row off. The negative run moves every reading_date a day, and the
      # count must find it and the check fail on readings.
      - name: Check deployment.yml
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          uv run tests/check_deployment.py sources/sensor_community
          q "CREATE DATABASE analytics_zones"
          q "CREATE TABLE analytics_zones.readings AS analytics.readings"
          q "INSERT INTO analytics_zones.readings SELECT * REPLACE (reading_date + 1 AS reading_date) FROM analytics.readings"
          if CLICKHOUSE_DATABASE=analytics_zones uv run tests/check_deployment.py sources/sensor_community > zones.txt; then cat zones.txt; exit 1; fi
          cat zones.txt
          grep -q '^FAIL readings has rows' zones.txt
      - name: Check column contracts and the built tables
        run: uv run tests/check_contracts.py --built sources/sensor_community
      - name: Validate the Ossie model against the built tables
        run: dactopus-ossie-clickhouse validate entities/iot.yaml --url "$OSSIE_CLICKHOUSE_URL"
      # The late rows above were loaded now. dbt v2 needs the package's own
      # freshness macros (macros/freshness.sql) to get this far. The age dbt
      # reports must match ClickHouse's own (tests/check_freshness.py), for
      # each source with freshness.
      - name: Source freshness
        run: |
          ${DBT_BUILD/dbt build/dbt source freshness}
          for t in readings locations; do
              ${DBT_BUILD/dbt build/dbt source freshness} --select "source:sensor_community_raw.$t"
              python3 tests/check_freshness.py sources/sensor_community "SELECT max(loaded_at) FROM sensor_community_input.$t"
          done
      # Every row carries the label the build was given (sensor_community_source_id).
      # CI's builds give one other than the package's default, and the
      # one-label tests hold every table to it. A label the package does not
      # accept stops the build; a new label over tables built under the old
      # one fails those tests, with a message that names --full-refresh.
      - name: Label of the network
        run: |
          if ${DBT_BUILD/network_a/Network-a} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'sensor_community_source_id must be 1 to 64 characters' label.txt
          if ${DBT_BUILD/network_a/network_b} > label.txt 2>&1; then cat label.txt; exit 1; fi
          grep -q 'run dbt build --full-refresh once after changing sensor_community_source_id' label.txt
  unions:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.unions == 'true'
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: Unions (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
          # A server time zone other than UTC: nothing may assume UTC.
          TZ: Asia/Makassar
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DBT: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: .github/workflows/ci.yml
      - name: Install dactopus-ossie-clickhouse
        run: uv tool install "dactopus-ossie-clickhouse @ git+https://github.com/Dactopus/dactopus-ossie-clickhouse@v0.12.0"
      # The instances: each package's fixture built into a database of its
      # own under a label of its own. WooCommerce twice, from one input: the
      # two have the same order, customer and product ids, which only the
      # label keeps apart; the second keeps its accounts in euros, in
      # Berlin's time zone, so the union holds two currencies and two
      # zones: its input is the fixture with each order's USD read as EUR.
      # Shopify beside them: the commerce union adds up the tables of two
      # packages.
      - name: Build the instances
        run: |
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          load sources/shopify/input.sql shopify_input
          load tests/shopify/fixture.sql shopify_input
          load sources/woocommerce/input.sql woocommerce_input
          load tests/woocommerce/fixture.sql woocommerce_input
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          q "CREATE DATABASE analytics_woo_b_input"
          for t in $(q "SELECT name FROM system.tables WHERE database = 'woocommerce_input'"); do
              q "CREATE VIEW analytics_woo_b_input.$t AS SELECT * FROM woocommerce_input.$t"
          done
          q "CREATE OR REPLACE VIEW analytics_woo_b_input.wp_wc_orders AS
              SELECT * REPLACE (if(currency = 'USD', 'EUR', currency) AS currency) FROM woocommerce_input.wp_wc_orders"
          load sources/ga4/input.sql ga4_input
          load tests/ga4/fixture.sql ga4_input
          load sources/sensor_community/input.sql sensor_community_input
          load tests/sensor_community/fixture.sql sensor_community_input
          # build <database> <package> <vars>
          build() { CLICKHOUSE_DATABASE=$1 $DBT build --project-dir sources/$2 --profiles-dir tests --vars "$3"; }
          build analytics_shop shopify '{"shopify_input_database":"shopify_input","shopify_timezone":"America/New_York","shopify_source_id":"shop"}'
          build analytics_woo_a woocommerce '{"woocommerce_input_database":"woocommerce_input","woocommerce_timezone":"America/New_York","woocommerce_currency":"USD","woocommerce_source_id":"woo_a"}'
          build analytics_woo_b woocommerce '{"woocommerce_input_database":"analytics_woo_b_input","woocommerce_timezone":"Europe/Berlin","woocommerce_currency":"EUR","woocommerce_source_id":"woo_b"}'
          build analytics_ga4_a ga4 '{"ga4_input_database":"ga4_input","ga4_source_id":"property_a"}'
          build analytics_ga4_b ga4 '{"ga4_input_database":"ga4_input","ga4_source_id":"property_b"}'
          build analytics_iot_a sensor_community '{"sensor_community_input_database":"sensor_community_input","sensor_community_source_id":"network_a"}'
          build analytics_iot_b sensor_community '{"sensor_community_input_database":"sensor_community_input","sensor_community_source_id":"network_b"}'
      # Each union, its test (a label in one database),
      # its views against its contracts and its deployment.yml. Then the
      # Ossie model over the union: each label's answers there must be its
      # database's own, and a total of counts and sums their sum
      # (tests/check_union.py).
      - name: Build the unions and check their answers
        run: |
          # union <database> <domain> <vars>
          union() {
              CLICKHOUSE_DATABASE=$1 $DBT build --project-dir unions/$2 --profiles-dir tests --vars "$3"
              CLICKHOUSE_DATABASE=$1 uv run tests/check_contracts.py --built unions/$2
              uv run tests/check_deployment.py unions/$2; }
          union analytics_commerce commerce '{"commerce_union_databases":["analytics_shop","analytics_woo_a","analytics_woo_b"]}'
          union analytics_web web_analytics '{"web_analytics_union_databases":["analytics_ga4_a","analytics_ga4_b"]}'
          union analytics_iot iot '{"iot_union_databases":["analytics_iot_a","analytics_iot_b"]}'
          dactopus-ossie-clickhouse validate entities/commerce.yaml --url http://127.0.0.1:8123/analytics_commerce
          dactopus-ossie-clickhouse validate entities/web_analytics.yaml --url http://127.0.0.1:8123/analytics_web
          dactopus-ossie-clickhouse validate entities/iot.yaml --url http://127.0.0.1:8123/analytics_iot
          OSSIE_CLICKHOUSE_TIME_ZONE=America/New_York uv run tests/check_union.py entities/commerce.yaml \
              http://127.0.0.1:8123/analytics_commerce http://127.0.0.1:8123/analytics_shop \
              http://127.0.0.1:8123/analytics_woo_a http://127.0.0.1:8123/analytics_woo_b
          uv run tests/check_union.py entities/web_analytics.yaml http://127.0.0.1:8123/analytics_web \
              http://127.0.0.1:8123/analytics_ga4_a http://127.0.0.1:8123/analytics_ga4_b
          uv run tests/check_union.py entities/iot.yaml http://127.0.0.1:8123/analytics_iot \
              http://127.0.0.1:8123/analytics_iot_a http://127.0.0.1:8123/analytics_iot_b
      # A union's views read the instances' tables with the rights of the
      # user who built them (SQL SECURITY DEFINER): a user with SELECT on
      # the unions' databases alone gets the models' answers, also through
      # a package's own view over its input database (devices), and the
      # instances' databases stay closed to it.
      - name: A reader of the unions alone
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          q "CREATE USER reader IDENTIFIED WITH no_password"
          q "GRANT SELECT ON analytics_commerce.* TO reader"
          q "GRANT SELECT ON analytics_web.* TO reader"
          q "GRANT SELECT ON analytics_iot.* TO reader"
          dactopus-ossie-clickhouse query entities/commerce.yaml -m orders.order_count -d orders.source_id \
              --url http://reader@127.0.0.1:8123/analytics_commerce
          dactopus-ossie-clickhouse query entities/web_analytics.yaml -m sessions.session_count -d sessions.source_id \
              --url http://reader@127.0.0.1:8123/analytics_web
          dactopus-ossie-clickhouse query entities/iot.yaml -m readings.reading_count -d readings.source_id \
              --url http://reader@127.0.0.1:8123/analytics_iot
          dactopus-ossie-clickhouse query entities/iot.yaml -m devices.device_count -d devices.source_id \
              --url http://reader@127.0.0.1:8123/analytics_iot
          for t in analytics_shop.orders analytics_ga4_a.sessions analytics_iot_a.readings; do
              if curl -s --fail-with-body http://127.0.0.1:8123/ -u reader: --data-binary "SELECT count() FROM $t" > reader.txt; then
                  cat reader.txt; exit 1; fi
              grep -q 'Code: 497.*Not enough privileges' reader.txt
          done
      # Two databases built under one label would add up as one store: the
      # union's tests fail and say so. A database whose types are not the
      # contract's stops the build, also where UNION ALL would widen them
      # to the contract's (Decimal(26, 8), a time in another zone). A
      # union without its list of databases, with one twice, or with its
      # own target among them stops before building.
      - name: A label in two databases, other types, and no databases
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          q "CREATE DATABASE analytics_copy"
          for t in orders customers order_lines line_categories line_brands refunds sales_events products product_categories product_brands; do
              q "CREATE VIEW analytics_copy.$t AS SELECT * FROM analytics_woo_a.$t"
          done
          twice() { CLICKHOUSE_DATABASE=analytics_twice $DBT build --project-dir unions/commerce --profiles-dir tests "$@"; }
          if twice --vars '{"commerce_union_databases":["analytics_woo_a","analytics_copy"]}' > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q 'a source_id is in more than one database of commerce_union_databases' union.txt
          q "CREATE DATABASE analytics_old"
          for t in customers order_lines line_categories line_brands refunds sales_events products product_categories product_brands; do
              q "CREATE VIEW analytics_old.$t AS SELECT * FROM analytics_woo_b.$t"
          done
          q "CREATE VIEW analytics_old.orders AS SELECT * REPLACE (CAST(total AS Decimal(26, 8)) AS total,
              toTimeZone(order_time, 'America/New_York') AS order_time) FROM analytics_woo_b.orders"
          if twice --vars '{"commerce_union_databases":["analytics_woo_a","analytics_old"]}' > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q "analytics_old.orders.order_time is DateTime('America/New_York'), not DateTime('UTC')" union.txt
          grep -q 'analytics_old.orders.total is Decimal(26,8), not Decimal(38,8)' union.txt
          if CLICKHOUSE_DATABASE=analytics_woo_a $DBT build --project-dir unions/commerce --profiles-dir tests \
              --vars '{"commerce_union_databases":["analytics_woo_a","analytics_woo_b"]}' > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q "commerce_union_databases holds analytics_woo_a, the union's own target database" union.txt
          if twice > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q 'commerce_union_databases must be a list of the databases of the stores, each once' union.txt
          if twice --vars '{"commerce_union_databases":["analytics_woo_a","analytics_woo_a"]}' > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q 'commerce_union_databases must be a list of the databases of the stores, each once' union.txt
          if twice --vars '{"commerce_union_databases":{"analytics_woo_a":1,"analytics_woo_b":2}}' > union.txt 2>&1; then cat union.txt; exit 1; fi
          grep -q 'commerce_union_databases must be a list of the databases of the stores, each once' union.txt
  # The one check the branch requires. It runs whatever the jobs did and
  # passes when none failed or was cancelled: a job the changed files do
  # not reach is skipped, and a skipped required check of its own would
  # hold the pull request for ever.
  ci:
    runs-on: ubuntu-24.04
    needs: [changes, validate, ga4, shopify, woocommerce, sensor_community, unions]
    if: always()
    name: CI passed
    steps:
      - run: echo '${{ toJSON(needs) }}'
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
