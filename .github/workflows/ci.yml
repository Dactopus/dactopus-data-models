name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ga4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: GA4 package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (ga4_raw, dactopus): nothing may
      # assume a database name. The input database is ga4_input.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/ga4 --profiles-dir sources/ga4
        --vars {"ga4_input_database":"ga4_input"}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ossie-clickhouse
        run: uv tool install "ossie-clickhouse @ git+https://github.com/Dactopus/ossie-clickhouse@v0.2.2"
      # The GA4 sample needs a Google login, so CI runs on hand-written rows
      # (tests/ga4/fixture.sql) and checks the model's answers against numbers
      # derived from them by hand. The first build runs on an empty input, as
      # a deployment set up before its first load would.
      - name: Build (models, tests, unit tests) and check numbers
        run: |
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=ga4_input', s.encode())" "$1"; }
          load sources/ga4/input.sql
          $DBT_BUILD
          load tests/ga4/fixture.sql
          $DBT_BUILD                 # incremental into empty tables
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          python3 tests/ga4/check_numbers.py
          $DBT_BUILD --full-refresh
          python3 tests/ga4/check_numbers.py
      - name: Validate the Ossie model against the built tables
        run: ossie-clickhouse validate entities/web_analytics.yaml --url "$OSSIE_CLICKHOUSE_URL"

  shopify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt:
          - {name: v2, from: "dbt-oss", with: ""}
          - {name: v1, from: "dbt-core~=1.11.0", with: "dbt-clickhouse"}
    name: Shopify package (dbt ${{ matrix.dbt.name }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1  # passwordless default user over the network
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Databases other than the defaults (shopify_raw, dactopus): nothing
      # may assume a database name. The input database is shopify_input.
      # The fixture's numbers are in the shop's time zone, New York. No
      # lookback: a run rereads only what was loaded since the last one, so
      # the late loads below come in through the keys that pick them up.
      CLICKHOUSE_DATABASE: analytics
      DBT_BUILD: >-
        uvx --from ${{ matrix.dbt.from }} ${{ matrix.dbt.with && format('--with {0}', matrix.dbt.with) || '' }}
        dbt build --project-dir sources/shopify --profiles-dir sources/shopify
        --vars {"shopify_input_database":"shopify_input","shopify_timezone":"America/New_York","shopify_lookback_days":0}
      OSSIE_CLICKHOUSE_URL: http://127.0.0.1:8123/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ossie-clickhouse
        run: uv tool install "ossie-clickhouse @ git+https://github.com/Dactopus/ossie-clickhouse@v0.2.2"
      # Hand-written rows (tests/shopify/fixture.sql) and the model's answers
      # over them, checked against numbers derived by hand; the first build
      # runs on an empty input. The fixture goes into a database of its own
      # and reaches the input in loads, each followed by an incremental
      # run: all but a few rows, then rows that only a trigger brings back
      # in. The lines of 1012, a guest's order, and of the gift card refund
      # 505 change orders that nothing else rereads; 1008, back-dated,
      # renumbers its customer's 1007. After the late loads, the incremental
      # build must match a full refresh of the same input row for row.
      - name: Build (models, tests, unit tests), check numbers, incremental and full refresh
        run: |
          q() { curl -sf http://127.0.0.1:8123/ --data-binary "$1"; }
          load() { python3 -c "
          import pathlib, sys, urllib.request
          for s in pathlib.Path(sys.argv[1]).read_text().split(';\n'):
              if s.strip():
                  urllib.request.urlopen('http://127.0.0.1:8123/?param_db=' + sys.argv[2], s.encode())" "$1" "$2"; }
          # early <table> <rows held back>; late <table> <rows>, loaded now
          early() { q "INSERT INTO shopify_input.$1 SELECT * FROM shopify_fixture.$1 WHERE NOT ($2)"; }
          late() { q "INSERT INTO shopify_input.$1 SELECT * REPLACE (now64(6) AS loaded_at) FROM shopify_fixture.$1 WHERE $2"; }
          tables() { for t in orders order_lines refunds; do
              q "SELECT '$t', count(), groupBitXor(cityHash64(toString(tuple(*)))) FROM $1.$t FORMAT TSV"; done; }
          same() {
              CLICKHOUSE_DATABASE=analytics_full $DBT_BUILD --full-refresh
              tables analytics > incremental.tsv
              tables analytics_full > full.tsv
              cat full.tsv
              diff incremental.tsv full.tsv; }
          load sources/shopify/input.sql shopify_input
          load sources/shopify/input.sql shopify_fixture
          load tests/shopify/fixture.sql shopify_fixture
          $DBT_BUILD
          early orders "id = 1008"
          early order_lines "order_id IN (1008, 1012)"
          early refunds "false"
          early refund_lines "refund_id = 505"
          $DBT_BUILD                 # incremental into empty tables
          late order_lines "order_id = 1012"
          late refund_lines "refund_id = 505"
          $DBT_BUILD                 # lines of orders loaded before
          same
          late orders "id = 1008"
          late order_lines "order_id = 1008"
          $DBT_BUILD                 # a back-dated order
          python3 tests/shopify/check_numbers.py
          $DBT_BUILD                 # incremental over unchanged input
          python3 tests/shopify/check_numbers.py
          same
          OSSIE_CLICKHOUSE_URL=http://127.0.0.1:8123/analytics_full python3 tests/shopify/check_numbers.py
      - name: Validate the Ossie model against the built tables
        run: ossie-clickhouse validate entities/commerce.yaml --url "$OSSIE_CLICKHOUSE_URL"
