name: dactopus_web_analytics_union
version: "0.13.0"
profile: dactopus
model-paths: ["models"]
macro-paths: ["macros"]
vars:
  # The databases of the properties, each built by its package with its own
  # label (source_id), as a list: [property_a, property_b]. Required.
  web_analytics_union_databases: []
models:
  dactopus_web_analytics_union:
    # Views: the union holds no rows of its own and sees each build of
    # the properties at once.
    +materialized: view
    # Each view reads the properties' tables with the rights of the user who
    # built it, so a reader needs SELECT on the union's database only.
    +sql_security: definer
    +definer: CURRENT_USER
    # Every view's columns and their types are listed in schema.yml: the
    # columns entities/web_analytics.yaml reads, no others; a build stops on a
    # database that gives another type (tests/check_contracts.py).
    +contract: {enforced: true}
